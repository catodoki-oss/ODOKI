<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하랑이메이커 🌸</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap');

:root {
  --pink:#ffb6c1; --pink-dark:#ff7da1; --pink-light:#fff0f5;
  --purple:#c9b1ff; --purple-dark:#9b7fe8; --purple-light:#f3eeff;
  --yellow:#fff3b0; --green:#b8f0b8; --mint:#b2ebe0;
  --bg:#fff8fb; --text:#4a3f5c; --card:#ffffff;
  --shadow:0 4px 18px rgba(200,130,170,0.18); --radius:18px;
  --red:#ff6b6b; --orange:#ffa94d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Nanum Gothic',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
}
h2{font-size:22px;font-weight:800;color:var(--purple-dark);margin-bottom:6px;}

/* ── 버튼 ── */
.btn{
  display:inline-block;padding:11px 24px;border-radius:50px;
  border:none;cursor:pointer;font-size:14px;font-weight:700;
  font-family:'Nanum Gothic',sans-serif;
  transition:all .18s;box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07);}
.btn:active{transform:translateY(0);}
.btn-pink{background:var(--pink-dark);color:#fff;}
.btn-purple{background:var(--purple-dark);color:#fff;}
.btn-green{background:#5cc87a;color:#fff;}
.btn-gray{background:#ddd;color:#666;}
.btn-small{padding:7px 16px;font-size:12px;}
.btn-red{background:var(--red);color:#fff;}

/* ── 화면 ── */
.screen{display:none;}
.screen.active{display:flex;flex-direction:column;align-items:center;}

/* ══════════════════════════════
   타이틀 화면
══════════════════════════════ */
#screen-title{
  justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,#ffe4f0 0%,#f5e4ff 50%,#e4f0ff 100%);
}
.title-box{
  text-align:center;padding:44px 36px;
  background:rgba(255,255,255,.92);border-radius:32px;
  box-shadow:0 8px 40px rgba(200,130,170,.25);
  max-width:400px;width:92%;
}
.title-stars{font-size:22px;letter-spacing:4px;margin-bottom:10px;animation:twinkle 2.5s infinite;}
@keyframes twinkle{0%,100%{opacity:1;}50%{opacity:.5;}}
.title-logo{font-size:72px;margin-bottom:10px;animation:bounce 2s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.title-name{
  font-family:'Gaegu',cursive;
  font-size:42px;font-weight:700;
  background:linear-gradient(90deg,#ff6b9d,#a855f7,#3b82f6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:4px;
}
.title-sub{font-size:13px;color:#aaa;margin-bottom:6px;}
.title-sub2{font-size:12px;color:#c9a0dc;margin-bottom:28px;font-weight:700;}
.title-btns{display:flex;flex-direction:column;gap:13px;}

/* ══════════════════════════════
   앨범 화면
══════════════════════════════ */
#screen-album{
  min-height:100vh;padding:28px 16px 40px;gap:14px;
  background:linear-gradient(135deg,#ffe4f0,#f0e4ff);
}
.album-header{text-align:center;}
.album-count-badge{
  display:inline-block;background:var(--pink-dark);color:#fff;
  padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-top:4px;
}
.album-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:11px;width:100%;max-width:680px;
}
.album-card{
  background:#fff;border-radius:16px;padding:14px 8px;text-align:center;
  box-shadow:var(--shadow);min-height:108px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .18s;cursor:default;
}
.album-card:hover{transform:translateY(-3px);}
.album-card.locked{filter:grayscale(1);opacity:.38;}
.album-card .end-icon{font-size:30px;margin-bottom:6px;}
.album-card .end-name{font-size:11px;font-weight:700;line-height:1.4;}
.album-card .end-rare{font-size:10px;color:#bbb;margin-top:3px;}
.album-card.unlocked .end-rare{color:#ff7da1;}

/* ══════════════════════════════
   게임 화면
══════════════════════════════ */
#screen-game{
  min-height:100vh;padding:0;
  background:var(--bg);align-items:stretch;
}
.game-wrap{
  display:flex;flex-direction:column;
  width:100%;max-width:560px;margin:0 auto;
  padding:14px 14px 30px;gap:10px;
}

/* 상단바 */
.top-bar{
  background:linear-gradient(90deg,var(--pink-dark),var(--purple-dark));
  color:#fff;border-radius:var(--radius);padding:11px 18px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-weight:700;
}

/* 상태이상 배너 */
.ailment-banner{
  background:#fff3cd;border:2px solid #ffc107;
  border-radius:12px;padding:9px 14px;
  font-size:12px;font-weight:700;color:#856404;display:none;
}
.ailment-banner.show{display:block;}

/* 캐릭터 카드 */
.char-card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;
  display:flex;gap:14px;align-items:center;
}
.char-avatar-wrap{position:relative;flex-shrink:0;}
.char-avatar{
  width:88px;height:88px;border-radius:50%;
  background:linear-gradient(135deg,#ffe4f0,#f0e4ff);
  display:flex;align-items:center;justify-content:center;
  font-size:46px;border:3px solid var(--pink-dark);
  transition:all .3s;
}
.avatar-badge{
  position:absolute;bottom:-2px;right:-2px;
  background:var(--red);color:#fff;font-size:9px;
  padding:2px 6px;border-radius:20px;font-weight:700;display:none;
}
.avatar-badge.show{display:block;}
.char-info{flex:1;}
.char-name{font-size:17px;font-weight:800;color:var(--purple-dark);}
.char-age{font-size:11px;color:#bbb;margin-top:1px;margin-bottom:5px;}
.char-monologue{
  font-size:12px;color:#777;font-style:italic;
  background:var(--pink-light);border-radius:10px;
  padding:7px 11px;line-height:1.6;min-height:38px;
}

/* 주차 진행 */
.week-card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:11px 14px;
}
.week-label{font-size:11px;color:#aaa;font-weight:700;margin-bottom:8px;}
.week-days{display:flex;gap:5px;justify-content:center;}
.day-dot{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;background:#f0f0f0;color:#aaa;
  transition:all .2s;
}
.day-dot.done{background:var(--pink-dark);color:#fff;}
.day-dot.today{background:var(--purple-dark);color:#fff;box-shadow:0 0 0 3px #d9c4ff;}
.day-dot.weekend{background:var(--yellow);color:#aaa;}
.day-dot.today.weekend{background:#ffc857;color:#fff;box-shadow:0 0 0 3px #ffe4a0;}

/* 스탯 카드 */
.stat-card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 15px;
}
.stat-card-title{font-size:12px;font-weight:700;color:#bbb;margin-bottom:10px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-row{display:flex;align-items:center;gap:6px;}
.stat-label{font-size:11px;width:40px;flex-shrink:0;font-weight:700;color:var(--text);}
.stat-bar-wrap{flex:1;background:#f0f0f0;border-radius:10px;height:7px;overflow:hidden;}
.stat-bar{height:100%;border-radius:10px;transition:width .4s ease;}
.stat-val{font-size:11px;width:24px;text-align:right;font-weight:700;}
.stress-row{
  margin-top:10px;padding-top:9px;border-top:1px solid #f5f5f5;
  display:flex;align-items:center;gap:7px;
}
.stress-label{font-size:11px;font-weight:700;color:var(--red);width:56px;flex-shrink:0;}
.stress-bar-wrap{flex:1;background:#ffe0e0;border-radius:10px;height:9px;overflow:hidden;}
.stress-bar{height:100%;border-radius:10px;background:linear-gradient(90deg,#ffb347,var(--red));transition:width .4s;}
.stress-val{font-size:11px;font-weight:700;color:var(--red);width:24px;text-align:right;}

/* 액션 카드 */
.action-card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 14px;
}
.action-tabs{display:flex;gap:7px;margin-bottom:11px;}
.tab-btn{
  flex:1;padding:8px;border-radius:11px;
  border:2px solid transparent;background:#f5f5f5;
  font-size:12px;font-weight:700;cursor:pointer;
  font-family:'Nanum Gothic',sans-serif;
  transition:all .18s;
}
.tab-btn.active{background:var(--pink-dark);color:#fff;border-color:var(--pink-dark);}
.tab-content{display:none;}
.tab-content.active{display:block;}
.action-list{
  display:flex;flex-direction:column;gap:7px;
  max-height:240px;overflow-y:auto;
}
.action-list::-webkit-scrollbar{width:4px;}
.action-list::-webkit-scrollbar-thumb{background:var(--pink);border-radius:10px;}
.action-item{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--pink-light);border-radius:12px;padding:9px 12px;
  cursor:pointer;transition:all .18s;border:2px solid transparent;
}
.action-item:hover{border-color:var(--pink-dark);transform:translateX(3px);}
.action-item.locked{opacity:.4;cursor:not-allowed;background:#f5f5f5;}
.action-item.locked:hover{transform:none;border-color:transparent;}
.ai-left{flex:1;}
.ai-name{font-size:13px;font-weight:700;}
.ai-info{font-size:10px;color:#999;margin-top:2px;line-height:1.4;}
.ai-reward{font-size:12px;font-weight:700;color:var(--purple-dark);white-space:nowrap;margin-left:8px;}
.ai-reward.cost{color:var(--red);}
.ai-reward.free{color:#5cc87a;}

/* 주말 안내 */
.weekend-notice{
  background:var(--yellow);border-radius:12px;padding:10px 14px;
  font-size:12px;font-weight:700;color:#856404;text-align:center;display:none;
}
.weekend-notice.show{display:block;}

/* 로그 카드 */
.log-card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:11px 14px;
  max-height:115px;overflow-y:auto;
}
.log-card::-webkit-scrollbar{width:4px;}
.log-card::-webkit-scrollbar-thumb{background:var(--pink);border-radius:10px;}
.log-item{
  font-size:11px;color:#888;padding:3px 0;
  border-bottom:1px solid #f8f8f8;line-height:1.5;
}
.log-item.good{color:#5cc87a;}
.log-item.bad{color:var(--red);}
.log-item.event{color:var(--purple-dark);font-weight:700;}

/* 저장 버튼 행 */
.save-row{display:flex;gap:8px;justify-content:center;}

/* ══════════════════════════════
   엔딩 화면
══════════════════════════════ */
#screen-ending{
  min-height:100vh;justify-content:center;padding:30px 16px;
  background:linear-gradient(135deg,#ffe4f0,#f0e4ff);
}
.ending-box{
  background:#fff;border-radius:32px;padding:36px 26px;
  max-width:420px;width:100%;text-align:center;
  box-shadow:0 8px 40px rgba(200,130,170,.3);
}
.ending-fireworks{font-size:28px;letter-spacing:6px;margin-bottom:10px;animation:pop 1s infinite alternate;}
@keyframes pop{from{transform:scale(1);}to{transform:scale(1.15);}}
.ending-icon-big{font-size:76px;margin-bottom:14px;}
.ending-title{font-size:26px;font-weight:800;color:var(--purple-dark);margin-bottom:6px;}
.ending-sub{font-size:12px;color:#ffadc5;font-weight:700;margin-bottom:14px;}
.ending-desc{font-size:13px;color:#666;line-height:1.9;margin-bottom:18px;}
.ending-stats{
  text-align:left;background:var(--pink-light);
  border-radius:14px;padding:13px;margin-bottom:20px;
}
.ending-stats p{font-size:12px;margin-bottom:4px;}
.ending-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* ══════════════════════════════
   모달
══════════════════════════════ */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.55);z-index:999;
  align-items:center;justify-content:center;
  padding:16px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:#fff;border-radius:26px;padding:28px 22px;
  max-width:380px;width:100%;
  box-shadow:0 8px 50px rgba(0,0,0,.22);text-align:center;
  animation:popIn .25s ease;max-height:90vh;overflow-y:auto;
}
@keyframes popIn{from{transform:scale(.82);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-icon{font-size:50px;margin-bottom:10px;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:8px;color:var(--purple-dark);white-space:pre-wrap;}
.modal-desc{font-size:13px;color:#666;line-height:1.8;margin-bottom:10px;white-space:pre-wrap;}
.modal-result{
  font-size:13px;font-weight:700;color:#333;
  line-height:1.9;margin-bottom:14px;white-space:pre-wrap;
  display:none;background:var(--purple-light);
  border-radius:10px;padding:10px;
}
.modal-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}

/* ── 토스트 ── */
@keyframes fadeInOut{
  0%{opacity:0;transform:translateX(-50%) translateY(-8px);}
  15%{opacity:1;transform:translateX(-50%) translateY(0);}
  80%{opacity:1;}
  100%{opacity:0;transform:translateX(-50%) translateY(-8px);}
}
</style>
</head>
<body>

<!-- ══ 타이틀 ══ -->
<div id="screen-title" class="screen active">
  <div class="title-box">
    <div class="title-stars">⭐🌟✨🌟⭐</div>
    <div class="title-logo">🌸</div>
    <div class="title-name">하랑이메이커</div>
    <div class="title-sub">10살 하랑이의 1년 성장 이야기 💕</div>
    <div class="title-sub2">과연 어떤 멋진 어른이 될까요? 🦋</div>
    <div class="title-btns">
      <button class="btn btn-pink" onclick="startNewGame()">🎮 새 게임 시작하기!</button>
      <button class="btn btn-purple" id="btn-continue" style="display:none" onclick="loadGame()">💾 이어서 하기</button>
      <button class="btn btn-gray" onclick="showAlbum()">📖 엔딩 앨범 구경하기</button>
    </div>
  </div>
</div>

<!-- ══ 앨범 ══ -->
<div id="screen-album" class="screen">
  <div class="album-header">
    <h2>📖 하랑이의 엔딩 앨범</h2>
    <div class="album-count-badge">✨ 달성: <span id="album-count">0</span> / <span id="album-total">0</span></div>
  </div>
  <div class="album-grid" id="album-grid"></div>
  <button class="btn btn-pink" onclick="showScreen('screen-title')">🏠 타이틀로 돌아가기</button>
</div>

<!-- ══ 게임 ══ -->
<div id="screen-game" class="screen">
  <div class="game-wrap">

    <div class="top-bar">
      <div id="ui-date">🗓 1월 1주차 (월)</div>
      <div id="ui-money">💰 5,000원</div>
    </div>

    <div class="ailment-banner" id="ailment-banner"></div>

    <div class="char-card">
      <div class="char-avatar-wrap">
        <div class="char-avatar" id="char-avatar">🐱</div>
        <div class="avatar-badge" id="avatar-badge">⚠️</div>
      </div>
      <div class="char-info">
        <div class="char-name">하랑이 🌸</div>
        <div class="char-age">🎂 10살 · 꿈많은 소녀</div>
        <div class="char-monologue" id="monologue">오늘도 신나게 해볼까~? ✨🎵</div>
      </div>
    </div>

    <div class="week-card">
      <div class="week-label">📅 이번 주 일정 — 주말(토·일)엔 꼭 쉬어요! 🛋️</div>
      <div class="week-days" id="week-days"></div>
    </div>

    <div class="weekend-notice" id="weekend-notice">
      🌈 오늘은 주말이에요! 공부나 알바보다 푹 쉬는 게 좋아요~ 💕 휴식 탭을 이용해요!
    </div>

    <div class="stat-card">
      <div class="stat-card-title">📊 하랑이 스테이터스</div>
      <div class="stat-grid" id="stat-grid"></div>
      <div class="stress-row">
        <div class="stress-label">😰 스트레스</div>
        <div class="stress-bar-wrap"><div class="stress-bar" id="stress-bar" style="width:0%"></div></div>
        <div class="stress-val" id="stress-val">0</div>
      </div>
    </div>

    <div class="action-card">
      <div class="action-tabs">
        <button class="tab-btn active" id="tab-btn-work" onclick="switchTab('work')">💼 알바</button>
        <button class="tab-btn" id="tab-btn-edu" onclick="switchTab('edu')">📚 교육</button>
        <button class="tab-btn" id="tab-btn-rest" onclick="switchTab('rest')">😴 휴식</button>
      </div>
      <div id="tab-work" class="tab-content active"><div class="action-list" id="work-list"></div></div>
      <div id="tab-edu"  class="tab-content"><div class="action-list" id="edu-list"></div></div>
      <div id="tab-rest" class="tab-content"><div class="action-list" id="rest-list"></div></div>
    </div>

    <div class="log-card" id="log-card">
      <div class="log-item event">🌸 하랑이메이커 시작! 1년 뒤 어떤 어른이 될까요? 💕</div>
    </div>

    <div class="save-row">
      <button class="btn btn-gray btn-small" onclick="saveGame()">💾 저장하기</button>
      <button class="btn btn-gray btn-small" onclick="confirmTitle()">🏠 타이틀</button>
    </div>

  </div>
</div>

<!-- ══ 엔딩 ══ -->
<div id="screen-ending" class="screen">
  <div class="ending-box">
    <div class="ending-fireworks" id="ending-fireworks">🎉🎊🎉🎊🎉</div>
    <div class="ending-icon-big" id="ending-icon">🌟</div>
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-sub" id="ending-sub"></div>
    <div class="ending-desc" id="ending-desc"></div>
    <div class="ending-stats" id="ending-stats"></div>
    <div class="ending-btns">
      <button class="btn btn-pink" onclick="showScreen('screen-title');checkContinueBtn()">🏠 타이틀</button>
      <button class="btn btn-purple" onclick="showAlbum()">📖 앨범 보기</button>
    </div>
  </div>
</div>

<!-- ══ 모달 ══ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-icon" id="modal-icon">🌟</div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-desc" id="modal-desc"></div>
    <div class="modal-result" id="modal-result"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════
//  데이터 정의
// ════════════════════════════════════════

const STAT_DEFS = [
  {key:'hp',        name:'체력',   color:'#5cc87a'},
  {key:'charm',     name:'매력',   color:'#ff8fa3'},
  {key:'diligence', name:'성실',   color:'#ffc857'},
  {key:'morality',  name:'성품',   color:'#a0c4ff'},
  {key:'humor',     name:'개그력', color:'#ffd166'},
  {key:'social',    name:'사교성', color:'#c9b1ff'},
  {key:'intel',     name:'지능',   color:'#74c0fc'},
  {key:'art',       name:'예술성', color:'#f783ac'},
  {key:'stamina',   name:'지구력', color:'#63e6be'},
  {key:'faith',     name:'신앙심', color:'#b8c0ff'},
];

const MONTH_NAMES=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const DAY_NAMES=['월','화','수','목','금','토','일'];

// ─────────────────────────────────
//  아르바이트 목록
// ─────────────────────────────────
function getWorkList(month){
  const season = month<=2||month===12?'winter':month<=5?'spring':month<=8?'summer':'autumn';
  const always = [

//  게임 상태
// ════════════════════════════════════════
let G = null;

function newGameState(){
  return {
    month:1, week:1, dayOfWeek:0, totalDays:0,
    money:5000,
    stats:{hp:30,charm:20,diligence:20,morality:20,humor:15,social:15,intel:20,art:15,stamina:20,faith:10},
    stress:0,
    ailment:null, ailmentWeeksLeft:0,
    workCount:{}, eduCount:{},
    runawayCount:0,
    actionDoneToday:false,
    weekDone:[],
    log:[],
    unlockedEndings:[],
  };
}

// ════════════════════════════════════════
//  화면 전환
// ════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function checkContinueBtn(){
  document.getElementById('btn-continue').style.display =
    localStorage.getItem('harang_save') ? 'inline-block' : 'none';
}
function confirmTitle(){
  if(confirm('타이틀로 돌아갈까요?\n(저장하지 않으면 진행이 사라져요!)')){
    showScreen('screen-title'); checkContinueBtn();
  }
}

// ════════════════════════════════════════
//  저장 / 불러오기
// ════════════════════════════════════════
function saveGame(){
  localStorage.setItem('harang_save', JSON.stringify(G));
  showModal('💾','저장 완료!','하랑이의 여정을 저장했어요 🌸💕',[{text:'확인 ✅',action:closeModal}]);
}
function loadGame(){
  const raw=localStorage.getItem('harang_save');
  if(!raw){alert('저장 데이터가 없어요!');return;}
  G=JSON.parse(raw);
  showScreen('screen-game');
  renderAll();
}
function startNewGame(){
  if(localStorage.getItem('harang_save')){
    if(!confirm('새 게임을 시작하면 기존 저장이 사라져요. 계속할까요?')) return;
  }
  G=newGameState();
  showScreen('screen-game');
  renderAll();
  addLog('🌸 하랑이의 1년이 시작됩니다! 1월 1주차 (월요일) 화이팅! 💕','event');
}

// ════════════════════════════════════════
//  렌더링
// ════════════════════════════════════════
function renderAll(){
  renderTopBar();
  renderCharAvatar();
  renderStats();
  renderWeekDays();
  renderActionPanel();
  renderAilmentBanner();
  renderLog();
}

function renderTopBar(){
  document.getElementById('ui-date').textContent =
    `🗓 ${MONTH_NAMES[G.month-1]} ${G.week}주차 (${DAY_NAMES[G.dayOfWeek]})`;
  document.getElementById('ui-money').textContent =
    `💰 ${G.money.toLocaleString()}원`;
}

const AVATARS = ['🐱','🐰','🦊','🐻','🐼','🦋','🌸','⭐','🎀','🍭'];
function renderCharAvatar(){
  const idx = Math.floor((G.stats.charm+G.stats.art)/25) % AVATARS.length;
  const el = document.getElementById('char-avatar');
  el.textContent = AVATARS[idx]; // textContent 직접 교체 (안전)
  const badge = document.getElementById('avatar-badge');
  badge.className = 'avatar-badge' + (G.ailment ? ' show' : '');
}

function renderStats(){
  const grid = document.getElementById('stat-grid');
  grid.innerHTML = '';
  STAT_DEFS.forEach(def=>{
    const val = Math.min(100, Math.max(0, G.stats[def.key]||0));
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <div class="stat-label">${def.name}</div>
      <div class="stat-bar-wrap">
        <div class="stat-bar" style="width:${val}%;background:${def.color}"></div>
      </div>
      <div class="stat-val">${val}</div>`;
    grid.appendChild(row);
  });
  const sv = Math.min(100, G.stress);
  document.getElementById('stress-bar').style.width = sv+'%';
  document.getElementById('stress-val').textContent = sv;
}

function renderWeekDays(){
  const wrap = document.getElementById('week-days');
  wrap.innerHTML = '';
  const isWeekend = G.dayOfWeek===5||G.dayOfWeek===6;
  DAY_NAMES.forEach((d,i)=>{
    const dot = document.createElement('div');
    let cls = 'day-dot';
    const isWE = i===5||i===6;
    if(i < G.dayOfWeek) cls += ' done';
    else if(i === G.dayOfWeek) cls += ' today' + (isWE?' weekend':'');
    else if(isWE) cls += ' weekend';
    dot.className = cls;
    dot.textContent = d;
    wrap.appendChild(dot);
  });
  // 주말 안내
  const notice = document.getElementById('weekend-notice');
  notice.className = 'weekend-notice' + (isWeekend?' show':'');
}

function renderActionPanel(){
  renderWorkList(); renderEduList(); renderRestList();
  if(G.dayOfWeek===5||G.dayOfWeek===6) switchTab('rest');
}

function renderWorkList(){
  const list = document.getElementById('work-list');
  list.innerHTML = '';
  getWorkList(G.month).forEach(w=>{
    const sr = calcSuccessRate(w);
    const div = document.createElement('div');
    div.className = 'action-item';
    div.innerHTML = `
      <div class="ai-left">
        <div class="ai-name">${w.icon} ${w.name}</div>
        <div class="ai-info">스트레스+${w.stress} | 성공률 ${sr}%</div>
      </div>
      <div class="ai-reward">+${w.reward.toLocaleString()}원</div>`;
    div.onclick = ()=>doWork(w);
    list.appendChild(div);
  });
}

function renderEduList(){
  const list = document.getElementById('edu-list');
  list.innerHTML = '';
  EDU_LIST.forEach(e=>{
    const ok = G.money >= e.cost;
    const div = document.createElement('div');
    div.className = 'action-item' + (ok?'':' locked');
    const effStr = Object.entries(e.effects).map(([k,v])=>getStatName(k)+(v>0?'+':'')+v).join(', ');
    div.innerHTML = `
      <div class="ai-left">
        <div class="ai-name">${e.icon} ${e.name}</div>
        <div class="ai-info">스트레스+${e.stress} | ${effStr}</div>
      </div>
      <div class="ai-reward cost">-${e.cost.toLocaleString()}원</div>`;
    if(ok) div.onclick = ()=>doEdu(e);
    list.appendChild(div);
  });
}

function renderRestList(){
  const list = document.getElementById('rest-list');
  list.innerHTML = '';
  getRestList(G.month).forEach(r=>{
    const ok = G.money >= r.cost;
    const div = document.createElement('div');
    div.className = 'action-item' + (!ok?' locked':'');
    div.innerHTML = `
      <div class="ai-left">
        <div class="ai-name">${r.icon} ${r.name}</div>
        <div class="ai-info">${r.desc}</div>
      </div>
      <div class="ai-reward ${r.cost===0?'free':'cost'}">${r.cost===0?'무료 🆓':'-'+r.cost.toLocaleString()+'원'}</div>`;
    if(ok) div.onclick = ()=>doRest(r);
    list.appendChild(div);
  });
}

function renderAilmentBanner(){
  const b = document.getElementById('ailment-banner');
  if(G.ailment && AILMENTS[G.ailment]){
    b.className = 'ailment-banner show';
    b.textContent = `${AILMENTS[G.ailment].name} (${G.ailmentWeeksLeft}주 남음) — ${AILMENTS[G.ailment].desc}`;
  } else {
    b.className = 'ailment-banner';
    b.textContent = '';
  }
}

function renderLog(){
  const card = document.getElementById('log-card');
  card.innerHTML = '';
  (G.log||[]).forEach(l=>{
    const div = document.createElement('div');
    div.className = 'log-item ' + (l.cls||'');
    div.textContent = l.text;
    card.appendChild(div);
  });
}

function getStatName(key){
  const d = STAT_DEFS.find(d=>d.key===key);
  return d ? d.name : key;
}

// ════════════════════════════════════════
//  탭 전환
// ════════════════════════════════════════
function switchTab(tab){
  ['work','edu','rest'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('tab-btn-'+t).classList.toggle('active', t===tab);
  });
}

// ════════════════════════════════════════
//  성공률
// ════════════════════════════════════════
function calcSuccessRate(work){
  let bonus = 0;
  const avg = Object.values(G.stats).reduce((a,b)=>a+b,0)/STAT_DEFS.length;
  bonus += Math.floor(avg/5);
  Object.entries(work.req||{}).forEach(([k,v])=>{
    bonus += Math.min(25, Math.floor(((G.stats[k]||0)-v)/2));
  });
  return Math.min(95, Math.max(25, 50+bonus));
}

// ════════════════════════════════════════
//  효과 적용
// ════════════════════════════════════════
function applyEffects(effects, mult=1.0){
  Object.entries(effects).forEach(([k,v])=>{
    if(G.stats[k] !== undefined){
      G.stats[k] = Math.min(100, Math.max(0, G.stats[k]+Math.round(v*mult)));
    }
  });
}

// ════════════════════════════════════════
//  날짜 진행
// ════════════════════════════════════════
function advanceDay(){
  G.weekDone.push(G.dayOfWeek);
  G.dayOfWeek++;
  G.totalDays++;
  G.actionDoneToday = false;

  // 상태이상 — 매일 효과
  if(G.ailment==='sick'){
    G.stats.hp = Math.max(0, G.stats.hp-5);
    addLog('😷 감기 몸살로 체력-5...','bad');
  }
  if(G.ailment==='princess'){
    G.stats.morality = Math.max(0, G.stats.morality-2);
    G.stats.charm = Math.min(100, G.stats.charm+1);
  }
  if(G.ailment==='confident'){
    G.stats.diligence = Math.min(100, G.stats.diligence+1);
    G.stats.morality = Math.max(0, G.stats.morality-1);
  }
  if(G.ailment==='fight'){
    // fight: 사교성 매일 -2
    G.stats.social = Math.max(0, G.stats.social-2);
  }

  // 주 넘어가기
  if(G.dayOfWeek >= 7){
    G.dayOfWeek = 0;
    G.weekDone = [];
    G.week++;

    // 상태이상 주 감소
    if(G.ailment && G.ailmentWeeksLeft > 0){
      G.ailmentWeeksLeft--;
      if(G.ailmentWeeksLeft <= 0){
        addLog(`✅ 상태이상 [${AILMENTS[G.ailment].name}]이 회복됐어요!`,'good');
        G.ailment = null;
      }
    }

    // 월 넘어가기
    if(G.week > 4){
      G.week = 1;
      G.month++;
      if(G.month > 12){
        setTimeout(()=>triggerEnding(), 600);
        return;
      }
      addLog(`🗓 ${MONTH_NAMES[G.month-1]}이 시작됐어요! 화이팅! 💕`,'event');
    }
  }
  renderAll();
}

// ════════════════════════════════════════
//  아르바이트
// ════════════════════════════════════════
function doWork(work){
  if(G.actionDoneToday){showToast('오늘은 이미 활동했어요! 내일 또 해요~ 😊');return;}
  if(G.ailment==='hospitalized'){showToast('입원 중이라 아무것도 할 수 없어요... 💤');return;}

  const mono = work.mono[Math.floor(Math.random()*work.mono.length)];
  setMonologue(`"${mono}"`);

  const rate = calcSuccessRate(work);
  const roll = Math.random()*100;
  let resultText, moneyMult, cls;

  if(roll > rate+15){
    moneyMult=0.5; cls='bad';
    resultText=`😢 실패... 보수 ${Math.floor(work.reward*.5).toLocaleString()}원을 받았어요.`;
  } else if(roll > rate-25){
    moneyMult=1.0; cls='';
    resultText=`😊 완료! 보수 ${work.reward.toLocaleString()}원을 받았어요.`;
  } else {
    moneyMult=1.5; cls='good';
    resultText=`🎉 대성공!! 보수 ${Math.floor(work.reward*1.5).toLocaleString()}원을 받았어요!`;
  }
  const earned = Math.floor(work.reward*moneyMult);
  G.money += earned;

  const mult = G.ailment==='burnout'?0.5 : G.ailment==='shy'?0.7 : 1.0;
  applyEffects(work.effects, mult);

  let stressAdd = G.ailment==='burnout' ? Math.floor(work.stress*1.3) : work.stress;
  G.stress = Math.min(100, G.stress+stressAdd);

  G.workCount[work.id] = (G.workCount[work.id]||0)+1;
  addLog(`[알바] ${work.icon}${work.name} — ${resultText}`, cls);
  advanceDay();

  showModal(work.icon, work.name,
    `${resultText}\n\n스트레스 +${stressAdd} 😰`,
    [{text:'확인 ✅', action:()=>{ closeModal(); checkStressEvent(); }}]
  );
}

// ════════════════════════════════════════
//  교육
// ════════════════════════════════════════
function doEdu(edu){
  if(G.actionDoneToday){showToast('오늘은 이미 활동했어요! 내일 또 해요~ 😊');return;}
  if(G.ailment==='hospitalized'){showToast('입원 중이라 아무것도 할 수 없어요... 💤');return;}
  if(G.money < edu.cost){showToast('돈이 부족해요! 💸');return;}

  const mono = edu.mono[Math.floor(Math.random()*edu.mono.length)];
  setMonologue(`"${mono}"`);

  G.money -= edu.cost;
  const mult = G.ailment==='burnout'?0.5 : G.ailment==='shy'?0.7 : 1.0;
  applyEffects(edu.effects, mult);

  let stressAdd = edu.stress;
  G.stress = Math.min(100, G.stress+stressAdd);
  G.eduCount[edu.id] = (G.eduCount[edu.id]||0)+1;

  const effStr = Object.entries(edu.effects)
    .map(([k,v])=>`${getStatName(k)} ${v>0?'+':''}${v}`)
    .join(', ');

  addLog(`[교육] ${edu.icon}${edu.name} — ${effStr} | -${edu.cost.toLocaleString()}원`,'good');
  advanceDay();

  showModal(edu.icon, edu.name+' 수강 완료! 🎓',
    `${effStr}\n수강료: -${edu.cost.toLocaleString()}원 💸\n스트레스 +${stressAdd} 😰`,
    [{text:'열심히 했어요! 💪', action:()=>{ closeModal(); checkStressEvent(); }}]
  );
}

// ════════════════════════════════════════
//  휴식
// ════════════════════════════════════════
function doRest(rest){
  if(G.actionDoneToday){showToast('오늘은 이미 활동했어요! 내일 또 해요~ 😊');return;}
  if(G.money < rest.cost){showToast('돈이 부족해요! 💸');return;}

  const mono = rest.mono[Math.floor(Math.random()*rest.mono.length)];
  setMonologue(`"${mono}"`);

  if(rest.cost > 0) G.money -= rest.cost;
  G.stress = Math.max(0, G.stress+rest.stress);

  if(rest.id==='rest_friend'){
    applyEffects(rest.effects);
    const friendNames=['소율이','지민이','하은이','예린이','수아이','나연이','다은이','서현이'];
    const friend = friendNames[Math.floor(Math.random()*friendNames.length)];
    addLog(`[휴식] 👭 ${friend}네 집에 놀러갔어요! 사교성+6, 스트레스${rest.stress}`,'good');
    advanceDay();
    showModal('👭', `${friend}네 집에서 놀았어요! 🎉`,
      `사교성이 올랐어요!\n스트레스가 ${Math.abs(rest.stress)} 감소했어요. 😊`,
      [{text:'신나~! 💕', action:()=>{ closeModal(); checkFriendFightEvent(); }}]
    );
    return;
  }

  if(rest.id==='rest_vacation'){
    applyEffects(rest.effects);
    addLog('[휴식] ✈️ 바캉스를 떠났어요! 스트레스 대폭 감소 😊','good');
    advanceDay();
    triggerVacationEvent();
    return;
  }

  applyEffects(rest.effects);
  addLog(`[휴식] ${rest.icon}${rest.name} — 스트레스 ${rest.stress}`,'good');
  advanceDay();
  showModal(rest.icon, rest.name,
    `기분이 좋아졌어요! 😊\n스트레스가 ${Math.abs(rest.stress)} 감소했어요. 💕`,
    [{text:'😊 좋아!', action:closeModal}]
  );
}

// ════════════════════════════════════════
//  스트레스 이벤트
// ════════════════════════════════════════
function checkStressEvent(){
  if(G.stress >= 90){
    const roll = Math.random();
    if(roll < 0.3){
      G.ailment='hospitalized'; G.ailmentWeeksLeft=2; G.stress=60;
      addLog('🏥 스트레스가 극에 달해 쓰러져 병원에 입원했어요...','bad');
      showModal('🏥','쓰러졌어요! 😱',
        '스트레스가 너무 쌓여 하랑이가 쓰러졌어요...\n2주간 입원 치료가 필요해요. 제발 쉬어요...',
        [{text:'😢 알겠어...', action:closeModal}]
      );
    } else if(roll < 0.55){
      G.runawayCount++; G.stress -= 30; G.stats.hp -= 10;
      addLog('🎒 스트레스를 못 이기고 가출했어요...','bad');
      showModal('🎒','가출했어요! 😱',
        '하랑이가 집을 나갔어요...\n며칠 후 돌아왔지만 체력이 많이 떨어졌어요.',
        [{text:'...돌아왔어 😢', action:closeModal}]
      );
    } else {
      G.ailment='sick'; G.ailmentWeeksLeft=2; G.stress -= 20;
      addLog('😷 스트레스로 감기 몸살에 걸렸어요!','bad');
      showModal('😷','몸살에 걸렸어요! 😷',
        '스트레스가 쌓여 감기 몸살이 났어요.\n2주간 체력이 매일 감소해요. 무리하지 마세요!',
        [{text:'😢 조심할게...', action:closeModal}]
      );
    }
  } else if(G.stress >= 70 && !G.ailment && Math.random()<0.18){
    const ailments = ['princess','confident','shy','fight'];
    const picked = ailments[Math.floor(Math.random()*ailments.length)];
    G.ailment = picked; G.ailmentWeeksLeft = 1;
    if(picked==='fight') G.stats.social = Math.max(0, G.stats.social-15);
    addLog(`⚠️ 상태이상 발생: ${AILMENTS[picked].name}`,'bad');
    showModal('⚠️','상태이상 발생! 😰',
      `${AILMENTS[picked].name}\n${AILMENTS[picked].desc}\n1주일간 지속돼요.`,
      [{text:'알겠어... 💦', action:closeModal}]
    );
  }
  renderAll();
}

// ════════════════════════════════════════
//  친구 싸움 이벤트
// ════════════════════════════════════════
function checkFriendFightEvent(){
  if(Math.random() < 0.15){
    const names=['소율이','지민이','하은이','예린이','수아이'];
    const friend = names[Math.floor(Math.random()*names.length)];
    showModal('😤',`${friend}랑 싸웠어요! 😱`,
      `사소한 일로 ${friend}랑 크게 다퉜어요!\n1주일간 사교성이 많이 떨어진 상태예요.`,
      [
        {text:'😢 내가 잘못했어', action:()=>{
          G.ailment='fight'; G.ailmentWeeksLeft=1;
          G.stats.social=Math.max(0,G.stats.social-18);
          addLog(`😤 ${friend}랑 싸웠어요. 사교성이 떨어졌어요.`,'bad');
          closeModal(); renderAll();
        }},
        {text:'😤 내가 맞아!', action:()=>{
          G.stats.humor=Math.min(100,G.stats.humor+5);
          G.stats.social=Math.max(0,G.stats.social-10);
          addLog(`😤 싸웠지만 기분은 후련해졌다(?)`,'');
          closeModal(); renderAll();
        }},
      ]
    );
  } else {
    closeModal();
  }
}

// ════════════════════════════════════════
//  바캉스 이벤트
// ════════════════════════════════════════
function triggerVacationEvent(){
  const ev = VACATION_EVENTS[Math.floor(Math.random()*VACATION_EVENTS.length)];
  const choices = ev.choices.map(c=>({
    text: c.text,
    action: ()=>{
      const mult = 2.2;
      applyEffects(c.effects, mult);
      if(c.stress) G.stress = Math.min(100, G.stress+c.stress);

      const effStr = Object.entries(c.effects)
        .map(([k,v])=>`${getStatName(k)} ${v*mult>0?'+':''}${Math.round(v*mult)}`)
        .join(', ');

      document.getElementById('modal-result').style.display = 'block';
      document.getElementById('modal-result').textContent = `${c.result}\n\n📊 ${effStr}`;
      document.getElementById('modal-btns').innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'btn btn-pink';
      btn.textContent = '집으로 돌아가기 🏠';
      btn.onclick = ()=>{ closeModal(); renderAll(); };
      document.getElementById('modal-btns').appendChild(btn);
      addLog(`[바캉스] ${ev.title} — ${c.result}`,'event');
      renderAll();
    }
  }));
  showModal(ev.icon, `✈️ 바캉스 이벤트!\n${ev.title}`, ev.desc, choices);
}

// ════════════════════════════════════════
//  엔딩 판정
// ════════════════════════════════════════
function triggerEnding(){
  // 배드 엔딩 (극단적 상태)
  if(G.stress>=95 && G.stats.hp<=10){
    const e = ENDINGS.find(x=>x.id==='e_bad_stress');
    unlockEnding('e_bad_stress');
    showEndingScreen(e); return;
  }

  // 히든 엔딩 (우선 체크)
  const hidden = ENDINGS.filter(e=>e.rare&&e.rare.includes('히든'));
  for(const e of hidden){
    if(e.cond(G)){ unlockEnding(e.id); showEndingScreen(e); return; }
  }

  // 일반 엔딩 (조건 충족하는 것 중 가장 희귀한 것)
  const normal = ENDINGS.filter(e=>
    !e.rare?.includes('히든') && e.id!=='e_normal' && e.id!=='e_bad_stress' && e.cond(G)
  );
  // ⭐⭐⭐ > ⭐⭐ > ⭐ 우선
  const rarityOrder = ['⭐⭐⭐','⭐⭐','⭐'];
  for(const r of rarityOrder){
    const filtered = normal.filter(e=>e.rare===r);
    if(filtered.length>0){
      const picked = filtered[Math.floor(Math.random()*filtered.length)];
      unlockEnding(picked.id); showEndingScreen(picked); return;
    }
  }

  // 기본 엔딩
  unlockEnding('e_normal');
  showEndingScreen(ENDINGS.find(e=>e.id==='e_normal'));
}

function unlockEnding(id){
  const saved = JSON.parse(localStorage.getItem('harang_endings')||'[]');
  if(!saved.includes(id)){ saved.push(id); localStorage.setItem('harang_endings',JSON.stringify(saved)); }
}

function showEndingScreen(ending){
  document.getElementById('ending-icon').textContent = ending.icon;
  document.getElementById('ending-title').textContent = ending.name;
  document.getElementById('ending-sub').textContent = ending.rare||'';
  document.getElementById('ending-desc').textContent = ending.desc;

  const stats = document.getElementById('ending-stats');
  stats.innerHTML = '<p style="font-weight:800;margin-bottom:7px">📊 최종 스테이터스</p>';
  STAT_DEFS.forEach(def=>{
    stats.innerHTML += `<p>${def.name}: <b>${G.stats[def.key]||0}</b></p>`;
  });
  stats.innerHTML += `<p>💰 최종 잔액: <b>${G.money.toLocaleString()}원</b></p>`;
  stats.innerHTML += `<p>😰 최종 스트레스: <b>${G.stress}</b></p>`;
  stats.innerHTML += `<p>📅 총 경과 일수: <b>${G.totalDays}일</b></p>`;

  localStorage.removeItem('harang_save');
  showScreen('screen-ending');
}

// ════════════════════════════════════════
//  앨범
// ════════════════════════════════════════
function showAlbum(){
  const unlocked = JSON.parse(localStorage.getItem('harang_endings')||'[]');
  const allEndings = ENDINGS; // bad_stress 포함 전체
  document.getElementById('album-count').textContent = unlocked.length;
  document.getElementById('album-total').textContent = allEndings.length;

  const grid = document.getElementById('album-grid');
  grid.innerHTML = '';
  allEndings.forEach(e=>{
    const isUnlocked = unlocked.includes(e.id);
    const card = document.createElement('div');
    card.className = 'album-card' + (isUnlocked?' unlocked':' locked');
    card.innerHTML = `
      <div class="end-icon">${isUnlocked?e.icon:'🔒'}</div>
      <div class="end-name">${isUnlocked?e.name:'???'}</div>
      <div class="end-rare">${isUnlocked?(e.rare||''):''}</div>`;
    grid.appendChild(card);
  });
  showScreen('screen-album');
}

// ════════════════════════════════════════
//  모달
// ════════════════════════════════════════
function showModal(icon, title, desc, choices=[]){
  document.getElementById('modal-icon').textContent = icon;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-desc').textContent = desc;
  document.getElementById('modal-result').style.display = 'none';
  document.getElementById('modal-result').textContent = '';

  const btns = document.getElementById('modal-btns');
  btns.innerHTML = '';
  choices.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'btn btn-pink';
    btn.textContent = c.text;
    btn.onclick = c.action;
    btns.appendChild(btn);
  });
  document.getElementById('modal-overlay').className = 'modal-overlay show';
}
function closeModal(){
  document.getElementById('modal-overlay').className = 'modal-overlay';
  renderAll();
}

// ════════════════════════════════════════
//  혼잣말
// ════════════════════════════════════════
function setMonologue(text){
  document.getElementById('monologue').textContent = text;
}

// ════════════════════════════════════════
//  로그
// ════════════════════════════════════════
function addLog(text, cls=''){
  if(!G.log) G.log=[];
  G.log.unshift({text, cls});
  if(G.log.length>40) G.log.pop();
  renderLog();
}

// ════════════════════════════════════════
//  토스트
// ════════════════════════════════════════
function showToast(msg){
  const el = document.createElement('div');
  el.style.cssText = [
    'position:fixed','top:20px','left:50%','transform:translateX(-50%)',
    'background:#333','color:#fff','padding:10px 22px',
    'border-radius:50px','font-size:13px','font-weight:700',
    'z-index:9999','white-space:nowrap',
    'animation:fadeInOut 2.2s ease forwards',
  ].join(';');
  el.textContent = msg;
  if(!document.getElementById('toast-style')){
    const s=document.createElement('style');
    s.id='toast-style';
    s.textContent='@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-8px);}15%{opacity:1;transform:translateX(-50%) translateY(0);}80%{opacity:1;}100%{opacity:0;transform:translateX(-50%) translateY(-8px);}}';
    document.head.appendChild(s);
  }
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

// ════════════════════════════════════════
//  초기화
// ════════════════════════════════════════
window.onload = function(){
  checkContinueBtn();
  // 앨범 총 개수 초기 표시
  const el = document.getElementById('album-total');
  if(el) el.textContent = ENDINGS.length;
};
</script>
