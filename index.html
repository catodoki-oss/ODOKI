<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하랑이메이커 🌸</title>
<style>
:root {
  --pk:#ff7da1; --pkl:#fff0f5; --pu:#9b7fe8; --pul:#f3eeff;
  --bg:#fff8fb; --tx:#4a3f5c; --ca:#fff; --sh:0 4px 18px rgba(200,130,170,.18);
  --ra:18px; --rd:#ff6b6b; --gn:#5cc87a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.btn{display:inline-block;padding:10px 22px;border-radius:50px;border:none;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:all .18s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.bp{background:var(--pk);color:#fff}
.bu{background:var(--pu);color:#fff}
.bg2{background:#ddd;color:#666}
.bs{padding:6px 14px;font-size:12px}
.screen{display:none}
.screen.active{display:flex;flex-direction:column;align-items:center}

/* 타이틀 */
#st{justify-content:center;min-height:100vh;background:linear-gradient(135deg,#ffe4f0,#f5e4ff,#e4f0ff)}
.tbox{text-align:center;padding:40px 32px;background:rgba(255,255,255,.93);border-radius:32px;box-shadow:0 8px 40px rgba(200,130,170,.25);max-width:400px;width:92%}
.tlogo-img{width:240px;height:240px;object-fit:cover;border-radius:20px;margin-bottom:10px;box-shadow:var(--sh)}
.tname{font-size:36px;font-weight:900;background:linear-gradient(90deg,#ff6b9d,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.tsub{font-size:13px;color:#aaa;margin-bottom:22px;line-height:1.7}
.tbtns{display:flex;flex-direction:column;gap:11px}

/* 앨범 */
#sa{min-height:100vh;padding:24px 14px 40px;gap:12px;background:linear-gradient(135deg,#ffe4f0,#f0e4ff)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%;max-width:700px}
.acard{background:#fff;border-radius:14px;padding:10px 7px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;min-height:160px;transition:transform .18s;cursor:default}
.acard:hover{transform:translateY(-3px)}
.acard.lk{filter:grayscale(1);opacity:.35}
.acard-img{width:80px;height:80px;object-fit:cover;border-radius:10px;margin-bottom:5px}
.acard-lock{width:80px;height:80px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;border-radius:10px;font-size:28px;margin-bottom:5px}
.en{font-size:11px;font-weight:700;line-height:1.4}
.er{font-size:10px;color:var(--pk);margin-top:3px}
.eh{font-size:9px;color:#bbb;margin-top:4px;line-height:1.4;font-style:italic;padding:0 4px}
.abadge{background:var(--pk);color:#fff;padding:3px 14px;border-radius:20px;font-size:12px;font-weight:700}

/* 게임 화면 */
#sg{min-height:100vh;background:var(--bg);align-items:stretch}
.gw{display:flex;flex-direction:column;width:100%;max-width:540px;margin:0 auto;padding:13px 13px 28px;gap:9px}
.topbar{background:linear-gradient(90deg,var(--pk),var(--pu));color:#fff;border-radius:var(--ra);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.abanner{background:#fff3cd;border:2px solid #ffc107;border-radius:11px;padding:8px 13px;font-size:12px;font-weight:700;color:#856404;display:none}
.abanner.show{display:block}
.ccard{background:var(--ca);border-radius:var(--ra);box-shadow:var(--sh);padding:13px;display:flex;gap:13px;align-items:center}
.cavt{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#ffe4f0,#f0e4ff);display:flex;align-items:center;justify-content:center;font-size:48px;border:3px solid var(--pk);flex-shrink:0}
.cinfo{flex:1}
.cname{font-size:16px;font-weight:800;color:var(--pu)}
.csub{font-size:11px;color:#bbb;margin-top:2px;margin-bottom:4px}
.cmono{font-size:12px;color:#777;font-style:italic;background:var(--pkl);border-radius:9px;padding:6px 10px;line-height:1.6;min-height:34px}
.stcard{background:var(--ca);border-radius:var(--ra);box-shadow:var(--sh);padding:12px 14px}
.sttitle{font-size:12px;font-weight:700;color:#bbb;margin-bottom:9px}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.strow{display:flex;align-items:center;gap:5px}
.stlb{font-size:11px;width:38px;flex-shrink:0;font-weight:700}
.stbw{flex:1;background:#f0f0f0;border-radius:10px;height:7px;overflow:hidden}
.stb{height:100%;border-radius:10px;transition:width .4s}
.stv{font-size:11px;width:22px;text-align:right;font-weight:700}
.ssrow{margin-top:9px;padding-top:8px;border-top:1px solid #f5f5f5;display:flex;align-items:center;gap:6px}
.sslb{font-size:11px;font-weight:700;color:var(--rd);width:54px;flex-shrink:0}
.ssbw{flex:1;background:#ffe0e0;border-radius:10px;height:8px;overflow:hidden}
.ssb{height:100%;border-radius:10px;background:linear-gradient(90deg,#ffb347,var(--rd));transition:width .4s}
.ssv{font-size:11px;font-weight:700;color:var(--rd);width:22px;text-align:right}

/* 스케줄 카드 */
.schcard{background:var(--ca);border-radius:var(--ra);box-shadow:var(--sh);padding:13px}
.schtit{font-size:13px;font-weight:800;color:var(--pu);margin-bottom:9px;text-align:center}
.mcal{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}
.wslot{border-radius:11px;border:2px solid #f0f0f0;padding:7px 3px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.wslot:hover{border-color:var(--pk);background:var(--pkl)}
.wslot.sel{border-color:var(--pk);background:var(--pkl)}
.wslot.asel{border-color:var(--pu);background:var(--pul)}
.wsnum{font-size:10px;font-weight:800;color:#bbb}
.wslot.sel .wsnum{color:var(--pk)}
.wslot.asel .wsnum{color:var(--pu)}
.wsico{font-size:17px}
.wsnm{font-size:9px;font-weight:700;line-height:1.3;word-break:keep-all}
.wsem{font-size:9px;color:#ccc}
.spick{background:var(--pkl);border-radius:11px;padding:9px;margin-bottom:9px}
.sptit{font-size:11px;font-weight:700;color:var(--pk);margin-bottom:7px}
.sptabs{display:flex;gap:5px;margin-bottom:7px}
.sptab{flex:1;padding:5px;border-radius:7px;border:none;background:#f0f0f0;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s}
.sptab.active{background:var(--pk);color:#fff}
.splist{display:flex;flex-direction:column;gap:5px;max-height:185px;overflow-y:auto}
.spitem{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;border:2px solid transparent;transition:all .18s}
.spitem:hover{border-color:var(--pk)}
.spitem.lkit{opacity:.38;cursor:not-allowed;pointer-events:none}
.spil{flex:1}
.spinm{font-size:12px;font-weight:700}
.spiin{font-size:10px;color:#999;margin-top:1px}
.spir{font-size:11px;font-weight:700;color:var(--pu);white-space:nowrap;margin-left:5px}
.schsum{font-size:11px;color:#888;text-align:center;margin-bottom:7px}
.approw{display:flex;gap:8px;justify-content:center}
#appbtn:disabled{opacity:.45;cursor:not-allowed}
.logcard{background:var(--ca);border-radius:var(--ra);box-shadow:var(--sh);padding:10px 13px;max-height:95px;overflow-y:auto}
.logi{font-size:11px;color:#888;padding:3px 0;border-bottom:1px solid #f8f8f8;line-height:1.5}
.logi.good{color:var(--gn)}
.logi.bad{color:var(--rd)}
.logi.event{color:var(--pu);font-weight:700}
.svrow{display:flex;gap:8px;justify-content:center}

/* 대화창 */
.dov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:500;align-items:flex-end;justify-content:center;padding-bottom:14px}
.dov.show{display:flex}
.dbox{background:#fff;border-radius:20px;max-width:490px;width:96%;box-shadow:0 -4px 30px rgba(0,0,0,.22);overflow:hidden;animation:sup .28s ease}
@keyframes sup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.dhdr{background:linear-gradient(135deg,#ffe4f0,#f0e4ff);padding:13px 15px;display:flex;align-items:center;gap:11px;border-bottom:2px solid var(--pkl)}
.dface{font-size:44px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;border:3px solid var(--pk);flex-shrink:0}
.dhinfo{flex:1}
.dhname{font-size:14px;font-weight:800;color:var(--pu)}
.dhlb{font-size:11px;color:#aaa;margin-top:2px}
.dprog{display:flex;gap:3px;align-items:center}
.dpdot{width:8px;height:8px;border-radius:50%;background:#eee;transition:background .3s}
.dpdot.dn{background:var(--pk)}
.dpdot.cu{background:var(--pu)}
.dbody{padding:14px 16px}
.dwtit{font-size:13px;font-weight:800;color:var(--pk);margin-bottom:7px}
.dtxt{font-size:14px;color:#444;line-height:1.95;min-height:60px;white-space:pre-wrap}
.dtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.dtag{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.dtag.up{background:#e8f8ee;color:var(--gn)}
.dtag.dn2{background:#ffe8e8;color:var(--rd)}
.dtag.mn{background:#fff3e0;color:#e67e22}
.dtag.ss{background:#fff0f0;color:var(--rd)}
.dftr{padding:9px 16px 13px;display:flex;justify-content:flex-end;gap:7px;border-top:1px solid #f5f5f5;flex-wrap:wrap}
.dnbtn{background:var(--pk);color:#fff;border:none;border-radius:20px;padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.dnbtn:hover{filter:brightness(1.08)}

/* 엔딩 */
#se{min-height:100vh;justify-content:center;padding:28px 14px;background:linear-gradient(135deg,#ffe4f0,#f0e4ff)}
.ebox{background:#fff;border-radius:30px;padding:34px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(200,130,170,.3)}
.efw{font-size:20px;letter-spacing:4px;margin-bottom:9px;animation:pp 1s infinite alternate}
@keyframes pp{from{transform:scale(1)}to{transform:scale(1.1)}}
.ending-img{width:200px;height:200px;object-fit:cover;border-radius:16px;margin-bottom:12px;box-shadow:var(--sh)}
.eico{font-size:56px;margin-bottom:6px}
.etit{font-size:24px;font-weight:800;color:var(--pu);margin-bottom:5px}
.esub{font-size:12px;color:#ffadc5;font-weight:700;margin-bottom:12px}
.edesc{font-size:13px;color:#666;line-height:1.9;margin-bottom:16px}
.estats{text-align:left;background:var(--pkl);border-radius:12px;padding:12px;margin-bottom:18px}
.estats p{font-size:12px;margin-bottom:4px}
.ebtns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* 모달 */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:center;justify-content:center;padding:14px}
.mov.show{display:flex}
.mbox{background:#fff;border-radius:24px;padding:26px 20px;max-width:370px;width:100%;box-shadow:0 8px 50px rgba(0,0,0,.22);text-align:center;animation:pi .25s ease;max-height:90vh;overflow-y:auto}
@keyframes pi{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.mico{font-size:48px;margin-bottom:9px}
.mtit{font-size:16px;font-weight:800;margin-bottom:7px;color:var(--pu)}
.mdesc{font-size:13px;color:#555;line-height:1.8;margin-bottom:13px;white-space:pre-wrap}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#ffb6c1;border-radius:10px}

/* ── 월별 배너 이미지 ── */
.month-banner{width:100%;max-width:540px;border-radius:var(--ra);overflow:hidden;box-shadow:var(--sh);display:none;margin:0 auto}
.month-banner img{width:100%;height:auto;display:block;object-fit:cover;max-height:90px}
.month-banner.show{display:block}

/* ── 이미지 팝업 공통 ── */
.imgpop-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1200;align-items:center;justify-content:center;padding:16px;animation:fadein .22s ease}
.imgpop-ov.show{display:flex}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.imgpop-box{background:#fff;border-radius:24px;box-shadow:0 8px 50px rgba(0,0,0,.28);animation:pi .25s ease;display:flex;flex-direction:column;align-items:center;overflow:hidden;max-height:92vh;position:relative}

/* 가로형 팝업 (알바·교육 — 5:1 비율, 가로로 긺) */
.imgpop-wide{max-width:480px;width:96%}
.imgpop-wide .imgpop-img{width:100%;height:auto;max-height:120px;object-fit:cover;display:block}

/* 세로형 팝업 (상태이상·바캉스 — 1:2 비율) */
.imgpop-tall{max-width:280px;width:82%}
.imgpop-tall .imgpop-img{width:100%;height:auto;max-height:400px;object-fit:contain;display:block;padding:8px 8px 0}

/* 팝업 공통 내용 영역 */
.imgpop-body{padding:12px 16px 14px;text-align:center;width:100%}
.imgpop-title{font-size:15px;font-weight:800;color:var(--pu);margin-bottom:5px}
.imgpop-msg{font-size:13px;color:#555;line-height:1.75;margin-bottom:11px;white-space:pre-wrap}
.imgpop-tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:11px}
.imgpop-close{background:var(--pk);color:#fff;border:none;border-radius:20px;padding:8px 28px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s}
.imgpop-close:hover{filter:brightness(1.08)}
</style>
</head>
<body>

<!-- 타이틀 화면 -->
<div id="st" class="screen active">
  <div class="tbox">
    <img src="imgs/title.png" class="tlogo-img" alt="하랑이메이커" onerror="this.style.display='none';document.getElementById('tlogo-fallback').style.display='block'">
    <div id="tlogo-fallback" style="font-size:72px;margin-bottom:8px;animation:bnc 2s infinite;display:none">👧</div>
    <style>@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}</style>
    <div class="tname">하랑이메이커</div>
    <div class="tsub">10살 하랑이의 1년 성장 이야기 💕<br>과연 어떤 멋진 어른이 될까요? 🦋</div>
    <div class="tbtns">
      <button class="btn bp" id="btnstart" onclick="startNew()">🎮 새 게임 시작!</button>
      <button class="btn bu" id="btncont" style="display:none" onclick="loadG()">💾 이어서 하기</button>
      <button class="btn bg2" onclick="showAlbum()">📖 엔딩 앨범 보기</button>
    </div>
  </div>
</div>

<!-- 앨범 화면 -->
<div id="sa" class="screen">
  <h2 style="color:var(--pu);margin-bottom:5px">📖 하랑이의 엔딩 앨범</h2>
  <div class="abadge">✨ 달성: <span id="acnt">0</span> / <span id="atot">0</span></div>
  <div class="agrid" id="agrid" style="margin-top:12px"></div>
  <br>
  <button class="btn bp" onclick="goScreen('st')">🏠 타이틀로</button>
</div>

<!-- ── 월별 배너 이미지 팝업 ── -->
<div class="imgpop-ov" id="monthpop-ov">
  <div class="imgpop-box imgpop-wide" style="max-width:420px">
    <img id="monthpop-img" class="imgpop-img" src="" alt="" onerror="this.style.display='none'">
    <div class="imgpop-body">
      <div class="imgpop-title" id="monthpop-title"></div>
      <div class="imgpop-msg" id="monthpop-msg"></div>
      <button class="imgpop-close" onclick="closeMonthPop()">✨ 시작하기!</button>
    </div>
  </div>
</div>

<!-- ── 알바 / 교육 이미지 팝업 (가로형) ── -->
<div class="imgpop-ov" id="workpop-ov">
  <div class="imgpop-box imgpop-wide">
    <img id="workpop-img" class="imgpop-img" src="" alt="" onerror="this.style.display='none'">
    <div class="imgpop-body">
      <div class="imgpop-title" id="workpop-title"></div>
      <div class="imgpop-msg" id="workpop-msg"></div>
      <div class="imgpop-tags" id="workpop-tags"></div>
      <button class="imgpop-close" onclick="closeWorkPop()">확인</button>
    </div>
  </div>
</div>

<!-- ── 상태이상 이미지 팝업 (세로형) ── -->
<div class="imgpop-ov" id="ailpop-ov">
  <div class="imgpop-box imgpop-tall">
    <img id="ailpop-img" class="imgpop-img" src="" alt="" onerror="this.style.display='none'">
    <div class="imgpop-body">
      <div class="imgpop-title" id="ailpop-title"></div>
      <div class="imgpop-msg" id="ailpop-msg"></div>
      <button class="imgpop-close" onclick="closeAilPop()">확인</button>
    </div>
  </div>
</div>

<!-- ── 바캉스 이미지 팝업 (세로형) ── -->
<div class="imgpop-ov" id="vacpop-ov">
  <div class="imgpop-box imgpop-tall">
    <img id="vacpop-img" class="imgpop-img" src="" alt="" onerror="this.style.display='none'">
    <div class="imgpop-body">
      <div class="imgpop-title" id="vacpop-title"></div>
      <div class="imgpop-msg" id="vacpop-msg"></div>
      <button class="imgpop-close" onclick="closeVacPop()">출발! ✈️</button>
    </div>
  </div>
</div>

<!-- 게임 화면 -->
<div id="sg" class="screen">
  <div class="gw">
    <div class="topbar">
      <div id="uidate">🗓 1월</div>
      <div id="uimoney">💰 5,000원</div>
    </div>
    <div class="abanner" id="abanner"></div>
    <div class="ccard">
      <div class="cavt" id="cavt">👧</div>
      <div class="cinfo">
        <div class="cname">하랑이 💕</div>
        <div class="csub" id="csub">기분 좋음</div>
        <div class="cmono" id="cmono">오늘도 열심히 해볼까!</div>
      </div>
    </div>
    <div class="stcard">
      <div class="sttitle">📊 스테이터스</div>
      <div class="stgrid" id="stgrid"></div>
      <div class="ssrow">
        <div class="sslb">😰 스트레스</div>
        <div class="ssbw"><div class="ssb" id="ssb" style="width:0%"></div></div>
        <div class="ssv" id="ssv">0</div>
      </div>
    </div>
    <div class="schcard" id="schcard">
      <div class="schtit" id="schtit"></div>
      <div class="mcal" id="mcal"></div>
      <div class="spick">
        <div class="sptit" id="sptit">1주차 일정을 선택하세요</div>
        <div class="sptabs">
          <button class="sptab active" id="ptw" onclick="switchTab('work')">알바</button>
          <button class="sptab" id="pte" onclick="switchTab('edu')">교육</button>
          <button class="sptab" id="ptr" onclick="switchTab('rest')">휴식</button>
        </div>
        <div class="splist" id="splist"></div>
      </div>
      <div class="schsum" id="schsum">0 / 4주 선택됨</div>
      <div class="approw">
        <button class="btn bp bs" id="appbtn" onclick="approveSchedule()" disabled>📋 이달 스케줄 확정!</button>
      </div>
    </div>
    <div class="logcard" id="logcard"></div>
    <div class="svrow">
      <button class="btn bu bs" onclick="saveG()">💾 저장</button>
      <button class="btn bg2 bs" onclick="confirmTitle()">🏠 타이틀</button>
    </div>
  </div>
</div>

<!-- 엔딩 화면 -->
<div id="se" class="screen">
  <div class="ebox">
    <div class="efw" id="efw">🎉🎊🎉🎊🎉</div>
    <img id="ending-img" src="" class="ending-img" alt="" style="display:none">
    <div class="eico" id="eico">🌟</div>
    <div class="etit" id="etit">엔딩</div>
    <div class="esub" id="esub"></div>
    <div class="edesc" id="edesc"></div>
    <div class="estats" id="estats"></div>
    <div class="ebtns">
      <button class="btn bp" onclick="goScreen('st');checkCont()">🔄 다시 하기</button>
      <button class="btn bu" onclick="showAlbum()">📖 앨범 보기</button>
    </div>

//  유틸
// ══════════════════════════════════════════
function getAvatar(g) {
  if (!g) return '👧';
  if (g.hasBoyfriend)             return '😍';
  if (g.stress >= 85)             return '😵';
  if (g.stress >= 70)             return '😵\u200d💫';
  if (g.ailment==='hospitalized') return '🤒';
  if (g.ailment==='sick')         return '😷';
  if (g.ailment==='princess')     return '🥰';
  if (g.ailment==='burnout')      return '😩';
  if (g.ailment==='shy')          return '😶';
  if (g.ailment==='fight')        return '😤';
  var hp = g.stats.hp || 0;
  var ch = g.stats.charm || 0;
  if (hp >= 70 && ch >= 60) return '😄';
  if (hp >= 50)             return '🙂';
  if (hp >= 30)             return '😐';
  return '😟';
}

function getCharSub(g) {
  if (!g) return '';
  if (g.hasBoyfriend)                   return '💕 남자친구 생김!';
  if (g.stress >= 85)                   return '🤯 극한의 스트레스...';
  if (g.stress >= 70)                   return '많이 지쳐있어요';
  if (g.ailment && AILMENTS[g.ailment]) return AILMENTS[g.ailment].name;
  if (g.stats.hp >= 70)                 return '💪 컨디션 최고!';
  if (g.stats.hp >= 40)                 return '😊 기분 좋음';
  return '좀 피곤해요';
}

function getStatName(key) {
  for (var i=0; i<SD.length; i++) { if (SD[i].key===key) return SD[i].name; }
  return key;
}

function getRandLine(arr) {
  if (!arr || !arr.length) return '';
  return arr[Math.floor(Math.random()*arr.length)];
}

function newGame() {
  return {
    month:1, money:5000,
    stats:{hp:25,charm:18,diligence:18,morality:18,humor:12,social:12,intel:18,art:12,stamina:18,faith:8},
    stress:0, ailment:null, ailmentMonths:0,
    workCount:{}, eduCount:{}, vacationCount:0,
    hasBoyfriend:false, runawayCount:0,
    monthSchedule:[null,null,null,null], selectingWeek:0, pickerTab:'work',

  };
}

// ══════════════════════════════════════════
//  화면 전환
// ══════════════════════════════════════════
function goScreen(id) {
  var all = document.querySelectorAll('.screen');
  for (var i=0; i<all.length; i++) all[i].classList.remove('active');
  var el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function confirmTitle() {
  if (confirm('타이틀로 돌아갈까요? 저장하지 않으면 진행이 사라집니다.')) {
    goScreen('st');
    checkCont();
  }
}

function checkCont() {
  var el = document.getElementById('btncont');
  if (el) el.style.display = localStorage.getItem('harang_save') ? 'inline-block' : 'none';
}

// ══════════════════════════════════════════
//  저장 / 불러오기
// ══════════════════════════════════════════
function saveG() {
  try {
    localStorage.setItem('harang_save', JSON.stringify(G));
    showToast('💾 저장 완료!');
  } catch(e) { showToast('저장 실패: '+e.message); }
}

function loadG() {
  try {
    var raw = localStorage.getItem('harang_save');
    if (!raw) { alert('저장 데이터가 없어요!'); return; }
    G = JSON.parse(raw);
    goScreen('sg');
    renderAll();
  } catch(e) { alert('데이터 오류: '+e.message); }
}

function startNew() {
  if (localStorage.getItem('harang_save')) {
    if (!confirm('새 게임을 시작하면 기존 저장이 사라집니다. 계속할까요?')) return;
  }
  G = newGame();
  goScreen('sg');
  renderAll();
  addLog('🌸 하랑이의 1년이 시작됩니다! 1월부터 시작해요.', 'event');
  showMonthPop(1);
}

// ══════════════════════════════════════════
//  전체 렌더링
// ══════════════════════════════════════════
function renderAll() {
  if (!G) return;
  renderTopBar();
  renderCharCard();
  renderStats();
  renderAilmentBanner();
  renderScheduleCard();
  renderLog();
}

function renderTopBar() {
  document.getElementById('uidate').textContent = '🗓 ' + MN[G.month-1];
  document.getElementById('uimoney').textContent = '💰 ' + G.money.toLocaleString() + '원';
}

function renderCharCard() {
  document.getElementById('cavt').textContent = getAvatar(G);
  document.getElementById('csub').textContent = getCharSub(G);
  var monoArr = ['오늘도 열심히 해볼까!','뭘 할까 고민 중이야~','파이팅!!','어떤 어른이 될까?','두근두근 설레~'];
  document.getElementById('cmono').textContent = getRandLine(monoArr);
}

function renderStats() {
  var grid = document.getElementById('stgrid');
  if (!grid) return;
  grid.innerHTML = '';
  for (var i=0; i<SD.length; i++) {
    var def = SD[i];
    var val = Math.min(SMAX, Math.max(0, G.stats[def.key]||0));
    var pct = Math.round(val/SMAX*100);
    var row = document.createElement('div');
    row.className = 'strow';
    row.innerHTML =
      '<div class="stlb">'+def.name+'</div>'+
      '<div class="stbw"><div class="stb" style="width:'+pct+'%;background:'+def.color+'"></div></div>'+
      '<div class="stv">'+val+'</div>';
    grid.appendChild(row);
  }
  var sp = Math.min(100, G.stress||0);
  var ssb = document.getElementById('ssb');
  if (ssb) ssb.style.width = sp+'%';
  var ssv = document.getElementById('ssv');
  if (ssv) ssv.textContent = sp;
}

function renderAilmentBanner() {
  var b = document.getElementById('abanner');
  if (!b) return;
  if (G.ailment && AILMENTS[G.ailment]) {
    b.textContent = AILMENTS[G.ailment].name+' — '+AILMENTS[G.ailment].desc+' ('+G.ailmentMonths+'달 남음)';
    b.classList.add('show');
  } else {
    b.classList.remove('show');
  }
}

function renderLog() {
  var lc = document.getElementById('logcard');
  if (!lc) return;
  lc.innerHTML = '';
  var logs = G.log || [];
  var start = Math.max(0, logs.length-12);
  for (var i=start; i<logs.length; i++) {
    var d = document.createElement('div');
    d.className = 'logi '+(logs[i].type||'');
    d.textContent = logs[i].msg;
    lc.appendChild(d);
  }
  lc.scrollTop = lc.scrollHeight;
}

function addLog(msg, type) {
  if (!G) return;
  G.log.push({msg:msg, type:type||''});
  if (G.log.length > 80) G.log = G.log.slice(-80);
  renderLog();
}

// ══════════════════════════════════════════
//  스케줄 카드 (단일 선언 — 중복 없음)
// ══════════════════════════════════════════
function renderScheduleCard() {
  if (!G) return;
  var schtit = document.getElementById('schtit');
  if (schtit) schtit.textContent = '📅 ' + MN[G.month-1] + ' 스케줄을 짜보세요!';

  if (G.ailment === 'hospitalized') {
    var sc = document.getElementById('schcard');
    if (sc) sc.innerHTML =
      '<div style="text-align:center;padding:22px;color:#ff6b6b;font-weight:700;">'+
      '🏥 입원 중입니다...<br>'+
      '<small style="color:#aaa;font-weight:400">이번 달은 쉬어야 해요.</small><br><br>'+
      '<button class="btn bp bs" onclick="skipHospital()">다음 달로 →</button>'+
      '</div>';
    return;
  }
  renderCalendar();
  renderPickerPanel();
  updateApproveBtn();
}

function renderCalendar() {
  var cal = document.getElementById('mcal');
  if (!cal) return;
  cal.innerHTML = '';
  for (var w=0; w<4; w++) {
    var sch = G.monthSchedule[w];
    var isSelecting = (w === G.selectingWeek);
    var cls = 'wslot';
    if (sch) cls += ' sel';
    else if (isSelecting) cls += ' asel';
    var slot = document.createElement('div');
    slot.className = cls;
    slot.setAttribute('data-week', w);
    slot.onclick = (function(week){ return function(){ selectWeek(week); }; })(w);
    if (sch) {
      slot.innerHTML =
        '<div class="wsnum">'+(w+1)+'주차</div>'+
        '<div class="wsico">'+sch.icon+'</div>'+
        '<div class="wsnm">'+sch.name+'</div>';
    } else {
      slot.innerHTML =
        '<div class="wsnum">'+(w+1)+'주차</div>'+
        '<div class="wsico" style="font-size:14px;color:#ddd">＋</div>'+
        '<div class="wsem">미선택</div>';
    }
    cal.appendChild(slot);
  }
}

function selectWeek(w) {
  G.selectingWeek = w;
  renderCalendar();
  var sptit = document.getElementById('sptit');
  if (sptit) sptit.textContent = (w+1)+'주차 일정을 선택하세요';
  renderPickerList(G.pickerTab);
}

function renderPickerPanel() {
  var tab = G.pickerTab || 'work';
  var tabs = ['work','edu','rest'];
  var ids  = ['ptw','pte','ptr'];
  for (var i=0; i<tabs.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) el.className = 'sptab'+(tabs[i]===tab?' active':'');
  }
  var sptit = document.getElementById('sptit');
  if (sptit) sptit.textContent = (G.selectingWeek+1)+'주차 일정을 선택하세요';
  renderPickerList(tab);
  updateSummary();
}

function switchTab(tab) {
  G.pickerTab = tab;
  renderPickerPanel();
}

function renderPickerList(tab) {
  var list = document.getElementById('splist');
  if (!list) return;
  list.innerHTML = '';
  var items = [];
  if (tab==='work') items = getWorkList(G.month);
  else if (tab==='edu') items = EDU;
  else items = getRestList(G.month);

  for (var i=0; i<items.length; i++) {
    var item = items[i];
    var canAfford = true;
    if (tab==='edu'||tab==='rest') canAfford = G.money >= (item.cost||0);
    var rightText = '';
    if (tab==='work') rightText = '+'+item.reward.toLocaleString()+'원';
    else if (tab==='edu') rightText = '-'+item.cost.toLocaleString()+'원';
    else rightText = item.cost>0 ? '-'+item.cost.toLocaleString()+'원' : '무료';

    var el = document.createElement('div');
    el.className = 'spitem'+(canAfford?'':' lkit');
    el.innerHTML =
      '<div class="spil">'+
      '<div class="spinm">'+item.icon+' '+item.name+'</div>'+
      '<div class="spiin">'+item.desc+'</div>'+
      '</div>'+
      '<div class="spir">'+rightText+'</div>';

    if (canAfford) {
      el.onclick = (function(it, tb){ return function(){ assignSchedule(it,tb); }; })(item, tab);
    }
    list.appendChild(el);
  }
}

function assignSchedule(item, tab) {
  var w = G.selectingWeek;
  var copy = {};
  for (var k in item) copy[k] = item[k];
  copy.tabType = tab;
  G.monthSchedule[w] = copy;
  var monoLine = getRandLine(item.mono) || '';
  document.getElementById('cmono').textContent = monoLine;
  // 다음 미선택 주로 자동 이동
  var next = -1;
  for (var i=0; i<4; i++) {
    if (G.monthSchedule[i] === null) { next = i; break; }
  }
  if (next >= 0) G.selectingWeek = next;
  renderCalendar();
  updateApproveBtn();
  var sptit = document.getElementById('sptit');
  if (sptit) sptit.textContent = (G.selectingWeek+1)+'주차 일정을 선택하세요';
  renderPickerList(G.pickerTab);
}

function updateSummary() {
  var filled = 0;
  for (var i=0; i<4; i++) { if (G.monthSchedule[i]!==null) filled++; }
  var el = document.getElementById('schsum');
  if (el) el.textContent = filled+' / 4주 선택됨';
}

function updateApproveBtn() {
  var filled = 0;
  for (var i=0; i<4; i++) { if (G.monthSchedule[i]!==null) filled++; }
  var btn = document.getElementById('appbtn');
  if (btn) {
    btn.disabled = (filled < 4);
    btn.style.opacity = filled<4 ? '0.45' : '1';
  }
  updateSummary();
}

// ══════════════════════════════════════════
//  결과 계산
// ══════════════════════════════════════════
function calcSuccessRate(sch) {
  var base = 75;
  if (G.ailment === 'burnout') base -= 20;
  if (G.ailment === 'shy')     base -= 15;
  if (G.stress >= 80)          base -= 15;
  else if (G.stress >= 60)     base -= 8;
  if (G.stats.hp >= 60)        base += 10;
  else if (G.stats.hp < 20)    base -= 10;
  return Math.min(95, Math.max(20, base));
}

function calcResult(sch) {
  var roll = Math.random()*100;
  var sr   = calcSuccessRate(sch);
  var outcome = roll < sr*0.25 ? 'great' : roll < sr ? 'normal' : 'fail';
  var mult = outcome==='great' ? 1.4 : outcome==='fail' ? 0.3 : 1.0;
  if (G.ailment==='burnout') mult *= 0.5;
  if (G.ailment==='shy')     mult *= 0.7;

  var eff = {};
  for (var k in (sch.effects||{})) eff[k] = Math.round((sch.effects[k]||0)*mult);
  var stressDelta = Math.round((sch.stress||0) * (outcome==='fail'?1.3:outcome==='great'?0.7:1.0));
  var moneyDelta  = 0;
  if (sch.tabType==='work')
    moneyDelta = outcome==='fail' ? Math.round(sch.reward*0.4) : outcome==='great' ? Math.round(sch.reward*1.3) : sch.reward;
  else if (sch.tabType==='edu' || sch.tabType==='rest')
    moneyDelta = -(sch.cost||0);

  return {outcome:outcome, eff:eff, stressDelta:stressDelta, moneyDelta:moneyDelta};
}

// ══════════════════════════════════════════
//  스탯 적용
// ══════════════════════════════════════════
function applyEff(eff) {
  for (var k in eff) {
    if (k==='hp'||k==='charm'||k==='diligence'||k==='morality'||k==='humor'||
        k==='social'||k==='intel'||k==='art'||k==='stamina'||k==='faith') {
      G.stats[k] = Math.min(SMAX, Math.max(0, (G.stats[k]||0)+(eff[k]||0)));
    }
  }
}

function showToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(60,40,80,.88);color:#fff;padding:10px 22px;border-radius:50px;font-size:13px;font-weight:700;z-index:9999;animation:fadeup .3s ease;pointer-events:none';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2200);
}

    } else {
      card.innerHTML =
        '<div class="acard-lock">🔒</div>'+
        '<div class="en" style="color:#ccc">???</div>'+
        '<div class="er">미해금</div>'+
        '<div class="eh">'+e.hint+'</div>';

  }
  goScreen('sa');
}

function unlockEnding(id) {
  var arr = JSON.parse(localStorage.getItem('harang_unlocked')||'[]');
  if (arr.indexOf(id) < 0) {
    arr.push(id);
    localStorage.setItem('harang_unlocked', JSON.stringify(arr));
  }
}

// ══════════════════════════════════════════
//  스케줄 확정 & 대화 큐
// ══════════════════════════════════════════
function approveSchedule() {
  var filled = 0;
  for (var i=0; i<4; i++) { if (G.monthSchedule[i]!==null) filled++; }
  if (filled < 4) { showToast('4주 스케줄을 모두 선택해주세요!'); return; }
  DQ = [];
  DI = 0;
  buildQueue();
  showDlg();
}

function buildQueue() {
  for (var w=0; w<4; w++) {
    var sch = G.monthSchedule[w];
    if (!sch) continue;
    var res = calcResult(sch);
    DQ.push({type:'result', week:w+1, sch:sch, res:res});
    if (sch.id === 'rest_vacation') {
      var vev = VEVENTS[Math.floor(Math.random()*VEVENTS.length)];
      DQ.push({type:'vacation', week:w+1, ev:vev});
    }
    if (sch.id === 'rest_friend' && Math.random() < 0.15) {
      DQ.push({type:'fight', week:w+1});
    }
  }
  // 4주차 이벤트
  var w4ev = W4EVENTS[Math.floor(Math.random()*W4EVENTS.length)];
  DQ.push({type:'week4', week:4, ev:w4ev});
}

function showDlg() {
  document.getElementById('dov').classList.add('show');
  renderDlgEntry();
}

function closeDlg() {
  document.getElementById('dov').classList.remove('show');
  document.getElementById('dftr').innerHTML = '<button class="dnbtn" onclick="dlgNext()">다음 ▶</button>';
}

function dlgNext() {
  DI++;
  if (DI >= DQ.length) {
    closeDlg();
    finishMonth();
    return;
  }
  renderDlgEntry();
}

function renderDlgEntry() {
  if (DI >= DQ.length) {
    closeDlg();
    finishMonth();
    return;
  }
  var entry = DQ[DI];
  // 진행 도트
  var prog = document.getElementById('dprog');
  if (prog) {
    prog.innerHTML = '';
    for (var i=0; i<DQ.length; i++) {
      var dot = document.createElement('div');
      dot.className = 'dpdot'+(i<DI?' dn':i===DI?' cu':'');
      prog.appendChild(dot);
    }
  }
  document.getElementById('dface').textContent = getAvatar(G);
  document.getElementById('dhlb').textContent = MN[G.month-1]+' '+entry.week+'주차';
  // footer 초기화
  document.getElementById('dftr').innerHTML = '<button class="dnbtn" onclick="dlgNext()">다음 ▶</button>';

  if (entry.type==='result')   renderResultEntry(entry);
  else if (entry.type==='vacation') renderVacationEntry(entry);
  else if (entry.type==='fight')    renderFightEntry(entry);
  else if (entry.type==='week4')    renderWeek4Entry(entry);
}

function renderResultEntry(entry) {
  var sch = entry.sch, res = entry.res;
  var outcomeLabel = res.outcome==='great'?'🎉 대성공!! ':res.outcome==='fail'?'😢 실패... ':'😊 완료! ';
  document.getElementById('dwtit').textContent = sch.icon+' '+entry.week+'주차: '+sch.name;
  document.getElementById('dtxt').textContent = outcomeLabel+'\n'+getRandLine(sch.mono||[]);
  var tags = document.getElementById('dtags');
  tags.innerHTML = '';
  for (var k in res.eff) {
    if (res.eff[k]!==0) {
      var span = document.createElement('span');
      var sign = res.eff[k]>0?'+':'';
      span.className = 'dtag '+(res.eff[k]>0?'up':'dn2');
      span.textContent = getStatName(k)+' '+sign+res.eff[k];
      tags.appendChild(span);
    }
  }
  if (res.moneyDelta!==0) {
    var ms = document.createElement('span');
    ms.className = 'dtag '+(res.moneyDelta>0?'up':'mn');
    ms.textContent = (res.moneyDelta>0?'+':'')+res.moneyDelta.toLocaleString()+'원';
    tags.appendChild(ms);
  }
  if (res.stressDelta!==0) {
    var ss = document.createElement('span');
    ss.className = 'dtag ss';
    ss.textContent = '스트레스 '+(res.stressDelta>0?'+':'')+res.stressDelta;
    tags.appendChild(ss);
  }
  // 실제 적용
  applyEff(res.eff);
  G.stress = Math.min(100, Math.max(0, (G.stress||0)+res.stressDelta));
  G.money  = Math.max(0, (G.money||0)+res.moneyDelta);
  // 카운트 업데이트
  if (sch.tabType==='work') {
    G.workCount[sch.id] = (G.workCount[sch.id]||0)+1;
    if (sch.id==='rest_vacation') G.vacationCount = (G.vacationCount||0)+1;
  }
  if (sch.tabType==='edu') G.eduCount[sch.id] = (G.eduCount[sch.id]||0)+1;
  if (sch.id==='rest_vacation') G.vacationCount = (G.vacationCount||0)+1;
  renderStats();
  renderTopBar();

  // ── 이미지 팝업 ──
  // 바캉스는 별도 세로형 팝업
  if (sch.id === 'rest_vacation') {
    var destName = sch.name.replace('바캉스 (','').replace(')','');
    setTimeout(function(){
      showVacPop(G.month, destName, null);
    }, 180);
    return;
  }
  // 알바 이미지
  var pimg = '';
  if (sch.tabType === 'work') pimg = WORK_IMGS[sch.id] || '';
  else if (sch.tabType === 'edu') pimg = EDU_IMGS[sch.id] || '';
  if (pimg) {
    var outcomeLabel2 = res.outcome==='great'?'🎉 대성공!! ':res.outcome==='fail'?'😢 실패... ':'😊 완료! ';
    var tagData = [];
    for (var tk in res.eff) {
      if (res.eff[tk]!==0) tagData.push({label: getStatName(tk)+' '+(res.eff[tk]>0?'+':'')+res.eff[tk], val: res.eff[tk]});
    }
    setTimeout(function(){
      showWorkPop(pimg, sch.icon+' '+sch.name, outcomeLabel2 + '\n' + (getRandLine(sch.mono||[])||''), tagData, null);
    }, 180);
  }
}

function renderVacationEntry(entry) {
  var ev = entry.ev;
  document.getElementById('dwtit').textContent = ev.icon+' 바캉스 이벤트!';
  document.getElementById('dtxt').textContent = ev.desc;
  document.getElementById('dtags').innerHTML = '';

    btn.textContent = ch.text;
    btn.style.background = i===0?'var(--pk)':'var(--pu)';
    btn.onclick = (function(choice){ return function(){
      applyEff(choice.eff||{});

      document.getElementById('dftr').innerHTML = '<button class="dnbtn" onclick="dlgNext()">다음 ▶</button>';

}

// ══════════════════════════════════════════
//  월 마무리
// ══════════════════════════════════════════
function applyResult() {
  // 상태이상 월별 효과
  if (G.ailment==='sick')       G.stats.hp = Math.max(0,(G.stats.hp||0)-4);
  if (G.ailment==='princess')   { G.stats.charm=Math.min(SMAX,(G.stats.charm||0)+1); G.stats.morality=Math.max(0,(G.stats.morality||0)-2); }
  if (G.ailment==='confident')  { G.stats.diligence=Math.min(SMAX,(G.stats.diligence||0)+1); G.stats.morality=Math.max(0,(G.stats.morality||0)-1); }
  if (G.ailment==='fight')      G.stats.social = Math.max(0,(G.stats.social||0)-15);
}

function finishMonth() {
  applyResult();
  // 상태이상 기간 감소
  if (G.ailment && G.ailmentMonths > 0) {
    G.ailmentMonths--;
    if (G.ailmentMonths <= 0) {
      addLog('✅ 상태이상 ['+AILMENTS[G.ailment].name+'] 회복!', 'good');
      G.ailment = null;
    }
  }
  checkStressAilment();
  addLog('🗓 '+MN[G.month-1]+' 완료! 다음 달로 넘어가요.', 'event');
  G.month++;
  G.monthSchedule = [null,null,null,null];
  G.selectingWeek = 0;
  G.pickerTab = 'work';

  if (G.month > 12) {
    setTimeout(function(){ triggerEnding(); }, 400);
    return;
  }
  rebuildSchCard();
  renderAll();
  showToast('🌸 '+MN[G.month-1]+'이 시작됐어요!');
  // 월 배너 팝업
  showMonthPop(G.month);
}

function skipHospital() {
  addLog('🏥 '+MN[G.month-1]+'은 입원으로 쉬었어요.', 'bad');
  G.stats.hp = Math.min(SMAX, (G.stats.hp||0)+5);
  if (G.ailmentMonths > 0) {
    G.ailmentMonths--;
    if (G.ailmentMonths <= 0) {
      G.ailment = null;
      addLog('✅ 퇴원했어요! 이제 활동할 수 있어요.', 'good');
    }
  }
  G.month++;
  G.monthSchedule = [null,null,null,null];
  G.selectingWeek = 0;
  G.pickerTab = 'work';
  if (G.month > 12) {
    setTimeout(function(){ triggerEnding(); }, 400);
    return;
  }
  rebuildSchCard();
  renderAll();
  showToast('🌸 '+MN[G.month-1]+'이 시작됐어요!');
  showMonthPop(G.month);
}

        '<button class="sptab active" id="ptw" onclick="switchTab(\'work\')">알바</button>'+

      '</div>'+
      '<div class="splist" id="splist"></div>'+

function checkStressAilment() {
  if (G.ailment) return;
  if (G.stress >= 90) {
    G.ailment = 'burnout'; G.ailmentMonths = 2;
    addLog('🤯 번아웃이 왔어요! 효과가 반감됩니다.', 'bad');
    setTimeout(function(){ showAilPop('burnout'); }, 300);
  } else if (G.stress >= 75 && Math.random() < 0.4) {
    var list = ['sick','princess','shy'];
    G.ailment = list[Math.floor(Math.random()*list.length)];
    G.ailmentMonths = 1+(Math.random()<0.3?1:0);
    addLog('⚠️ 상태이상 발생: '+AILMENTS[G.ailment].name, 'bad');
    setTimeout((function(k){ return function(){ showAilPop(k); }; })(G.ailment), 300);
  }
}

// ══════════════════════════════════════════
//  엔딩 체크
// ══════════════════════════════════════════
function triggerEnding() {
  // 번아웃 배드 엔딩
  if (G.stress >= 95 && G.stats.hp <= 8) {
    unlockEnding(BAD_ENDING.id);
    showEndingScreen(BAD_ENDING);
    return;
  }
  // 히든 엔딩 먼저
  for (var i=0; i<ENDINGS.length; i++) {
    var e = ENDINGS[i];
    if (e.rare && e.rare.indexOf('히든') >= 0) {
      if (e.cond(G)) { unlockEnding(e.id); showEndingScreen(e); return; }
    }
  }
  // 일반 엔딩
  var matched = [];
  for (var j=0; j<ENDINGS.length; j++) {
    var en = ENDINGS[j];
    if (en.id==='e_normal') continue;
    if (en.rare && en.rare.indexOf('히든') >= 0) continue;
    if (en.cond(G)) matched.push(en);
  }
  if (matched.length > 0) {
    var picked = matched[Math.floor(Math.random()*matched.length)];
    unlockEnding(picked.id); showEndingScreen(picked); return;
  }
  // 기본 엔딩
  var normal = null;
  for (var n=0; n<ENDINGS.length; n++) { if (ENDINGS[n].id==='e_normal') { normal=ENDINGS[n]; break; } }
  if (!normal) normal = ENDINGS[ENDINGS.length-1];
  unlockEnding('e_normal');
  showEndingScreen(normal);
}

function showEndingScreen(ending) {
  document.getElementById('eico').textContent  = ending.icon;
  document.getElementById('etit').textContent  = ending.name;
  document.getElementById('esub').textContent  = ending.rare || '';
  document.getElementById('edesc').textContent = ending.desc;
  document.getElementById('efw').textContent   =
    (ending.rare && ending.rare.indexOf('히든') >= 0) ? '🌟💎🌟💎🌟' : '🎉🎊🎉🎊🎉';

  // 엔딩 이미지 처리
  var imgEl = document.getElementById('ending-img');
  var imgSrc = ENDING_IMGS[ending.id] || '';
  if (imgSrc) {
    imgEl.src = imgSrc;
    imgEl.alt = ending.name;
    imgEl.style.display = 'block';
    imgEl.onerror = function(){ this.style.display='none'; };
  } else {
    imgEl.style.display = 'none';
  }

  // 최종 스탯
  var statsEl = document.getElementById('estats');
  statsEl.innerHTML = '<p style="font-weight:700;margin-bottom:6px">📊 최종 스테이터스</p>';
  for (var i=0; i<SD.length; i++) {
    var def = SD[i];
    statsEl.innerHTML += '<p>'+def.name+': <b>'+(G.stats[def.key]||0)+'</b></p>';
  }
  statsEl.innerHTML += '<p>💰 최종 잔액: <b>'+G.money.toLocaleString()+'원</b></p>';
  statsEl.innerHTML += '<p>😰 최종 스트레스: <b>'+(G.stress||0)+'</b></p>';

  goScreen('se');
  localStorage.removeItem('harang_save');
}
