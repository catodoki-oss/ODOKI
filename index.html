<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하랑이메이커 🌸</title>
<style>
:root {
  --pk:#ff7da1; --pkl:#fff0f5; --pu:#9b7fe8; --pul:#f3eeff;
  --bg:#fff8fb; --tx:#4a3f5c; --ca:#fff; --sh:0 4px 18px rgba(200,130,170,.18);
  --ra:18px; --rd:#ff6b6b; --gn:#5cc87a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.btn{display:inline-block;padding:10px 22px;border-radius:50px;border:none;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:all .18s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.bp{background:var(--pk);color:#fff}
.bu{background:var(--pu);color:#fff}
.bg2{background:#ddd;color:#666}
.bs{padding:6px 14px;font-size:12px}
.screen{display:none}
.screen.active{display:flex;flex-direction:column;align-items:center}

/* 타이틀 */
#st{justify-content:center;min-height:100vh;background:linear-gradient(135deg,#ffe4f0,#f5e4ff,#e4f0ff)}
.tbox{text-align:center;padding:40px 32px;background:rgba(255,255,255,.93);border-radius:32px;box-shadow:0 8px 40px rgba(200,130,170,.25);max-width:400px;width:92%}
.tlogo-img{width:240px;height:240px;object-fit:cover;border-radius:20px;margin-bottom:10px;box-shadow:var(--sh)}
.tname{font-size:36px;font-weight:900;background:linear-gradient(90deg,#ff6b9d,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.tsub{font-size:13px;color:#aaa;margin-bottom:22px;line-height:1.7}
.tbtns{display:flex;flex-direction:column;gap:11px}

/* 앨범 */
#sa{min-height:100vh;padding:24px 14px 40px;gap:12px;background:linear-gradient(135deg,#ffe4f0,#f0e4ff)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%;max-width:700px}
.acard{background:#fff;border-radius:14px;padding:10px 7px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;min-height:160px;transition:transform .18s;cursor:default}
.acard:hover{transform:translateY(-3px)}
.acard.lk{filter:grayscale(1);opacity:.35}
.acard-img{width:80px;height:80px;object-fit:cover;border-radius:10px;margin-bottom:5px}
.acard-lock{width:80px;height:80px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;border-radius:10px;font-size:28px;margin-bottom:5px}
.en{font-size:11px;font-weight:700;line-height:1.4}
.er{font-size:10px;color:var(--pk);margin-top:3px}
.eh{font-size:9px;color:#bbb;margin-top:4px;line-height:1.4;font-style:italic;padding:0 4px}
.abadge{background:var(--pk);color:#fff;padding:3px 14px;border-radius:20px;font-size:12px;font-weight:700}

/* 게임 화면 */
#sg{min-height:100vh;background:var(--bg);align-items:stretch}
.gw{display:flex;flex-direction:column;width:100%;max-width:540px;margin:0 auto;padding:13px 13px 28px;gap:9px}
.topbar{background:linear-gradient(90deg,var(--pk),var(--pu));color:#fff;border-radius:var(--ra);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.abanner{background:#fff3cd;border:2px solid #ffc107;border-radius:11px;padding:8px 13px;font-size:12px;font-weight:700;color:#856404;display:none}
.abanner.show{display:block}

/* ★ 계절/바캉스 이미지 배너 */
.season-banner{width:100%;border-radius:var(--ra);overflow:hidden;box-shadow:var(--sh);background:linear-gradient(135deg,#ffe4f0,#f0e4ff);display:flex;align-items:center;justify-content:center;min-height:160px;max-height:200px}
.season-banner img{width:100%;max-height:200px;object-fit:cover;border-radius:var(--ra);display:block}
.season-banner .season-fallback{font-size:64px;padding:20px}

/* ★ 아르바이트 이미지 배너 */
.work-img-banner{width:100%;border-radius:var(--ra);overflow:hidden;box-shadow:var(--sh);display:none;background:#fff;align-items:center;justify-content:center;min-height:130px;max-height:170px}
.work-img-banner.show{display:flex}
.work-img-banner img{width:100%;max-height:170px;object-fit:cover;border-radius:var(--ra);display:block}

/* ★ 상태이상 팝업 이미지 */
.ailment-popup-img{width:120px;height:120px;object-fit:cover;border-radius:14px;margin:0 auto 10px;display:block;box-shadow:var(--sh)}

/* 캐릭터 카드 */
.ccard{background:var(--ca);border-radius:var(--ra);box-shadow:var(--sh);padding:13px;display:flex;gap:13px;align-items:center}
.cavt{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#ffe4f0,#f0e4ff);display:flex;align-items:center;justify-content:center;font-size:48px;border:3px solid var(--pk);flex-shrink:0}
.cinfo{flex:1}
.cname{font-size:16px;font-weight:800;color:var(--pu)}
.csub{font-size:11px;color:#bbb;margin-top:2px;margin-bottom:4px}
.cmono{font-size:12px;color:#777;font-style:italic;background:var(--pkl);border-radius:9px;padding:6px 10px;line-height:1.6;min-height:34px}

/* ★ 스테이터스 카드 — 접기/펼치기 */
.stcard{background:var(--ca);border-radius:var(--ra);box-shadow:var(--sh);padding:12px 14px}
.stcard-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.sttitle{font-size:12px;font-weight:700;color:#bbb}
.st-toggle-btn{background:none;border:none;cursor:pointer;font-size:16px;color:#bbb;padding:2px 6px;border-radius:6px;transition:transform .25s}
.st-toggle-btn.open{transform:rotate(180deg)}
.stbody{overflow:hidden;transition:max-height .3s ease,opacity .3s ease;max-height:0;opacity:0}
.stbody.open{max-height:500px;opacity:1}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.strow{display:flex;align-items:center;gap:5px}
.stlb{font-size:11px;width:38px;flex-shrink:0;font-weight:700}
.stbw{flex:1;background:#f0f0f0;border-radius:10px;height:7px;overflow:hidden}
.stb{height:100%;border-radius:10px;transition:width .4s}
.stv{font-size:11px;width:22px;text-align:right;font-weight:700}
.ssrow{margin-top:9px;padding-top:8px;border-top:1px solid #f5f5f5;display:flex;align-items:center;gap:6px}
.sslb{font-size:11px;font-weight:700;color:var(--rd);width:54px;flex-shrink:0}
.ssbw{flex:1;background:#ffe0e0;border-radius:10px;height:8px;overflow:hidden}
.ssb{height:100%;border-radius:10px;background:linear-gradient(90deg,#ffb347,var(--rd));transition:width .4s}
.ssv{font-size:11px;font-weight:700;color:var(--rd);width:22px;text-align:right}

/* 스케줄 카드 */
.schcard{background:var(--ca);border-radius:var(--ra);box-shadow:var(--sh);padding:13px}
.schtit{font-size:13px;font-weight:800;color:var(--pu);margin-bottom:9px;text-align:center}
.mcal{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}
.wslot{border-radius:11px;border:2px solid #f0f0f0;padding:7px 3px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.wslot:hover{border-color:var(--pk);background:var(--pkl)}
.wslot.sel{border-color:var(--pk);background:var(--pkl)}
.wslot.asel{border-color:var(--pu);background:var(--pul)}
.wsnum{font-size:10px;font-weight:800;color:#bbb}
.wslot.sel .wsnum{color:var(--pk)}
.wslot.asel .wsnum{color:var(--pu)}
.wsico{font-size:17px}
.wsnm{font-size:9px;font-weight:700;line-height:1.3;word-break:keep-all}
.wsem{font-size:9px;color:#ccc}
.spick{background:var(--pkl);border-radius:11px;padding:9px;margin-bottom:9px}
.sptit{font-size:11px;font-weight:700;color:var(--pk);margin-bottom:7px}
.sptabs{display:flex;gap:5px;margin-bottom:7px}
.sptab{flex:1;padding:5px;border-radius:7px;border:none;background:#f0f0f0;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s}
.sptab.active{background:var(--pk);color:#fff}
.splist{display:flex;flex-direction:column;gap:5px;max-height:185px;overflow-y:auto}
.spitem{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;border:2px solid transparent;transition:all .18s}
.spitem:hover{border-color:var(--pk)}
.spitem.lkit{opacity:.38;cursor:not-allowed;pointer-events:none}
.spil{flex:1}
.spinm{font-size:12px;font-weight:700}
.spiin{font-size:10px;color:#999;margin-top:1px}
.spir{font-size:11px;font-weight:700;color:var(--pu);white-space:nowrap;margin-left:5px}
.schsum{font-size:11px;color:#888;text-align:center;margin-bottom:7px}
.approw{display:flex;gap:8px;justify-content:center}
#appbtn:disabled{opacity:.45;cursor:not-allowed}
.logcard{background:var(--ca);border-radius:var(--ra);box-shadow:var(--sh);padding:10px 13px;max-height:95px;overflow-y:auto}
.logi{font-size:11px;color:#888;padding:3px 0;border-bottom:1px solid #f8f8f8;line-height:1.5}
.logi.good{color:var(--gn)}
.logi.bad{color:var(--rd)}
.logi.event{color:var(--pu);font-weight:700}
.svrow{display:flex;gap:8px;justify-content:center}

/* 대화창 */
.dov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:500;align-items:flex-end;justify-content:center;padding-bottom:14px}
.dov.show{display:flex}
.dbox{background:#fff;border-radius:20px;max-width:490px;width:96%;box-shadow:0 -4px 30px rgba(0,0,0,.22);overflow:hidden;animation:sup .28s ease}
@keyframes sup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.dhdr{background:linear-gradient(135deg,#ffe4f0,#f0e4ff);padding:13px 15px;display:flex;align-items:center;gap:11px;border-bottom:2px solid var(--pkl)}
.dface{font-size:44px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;border:3px solid var(--pk);flex-shrink:0}
.dhinfo{flex:1}
.dhname{font-size:14px;font-weight:800;color:var(--pu)}
.dhlb{font-size:11px;color:#aaa;margin-top:2px}
.dprog{display:flex;gap:3px;align-items:center}
.dpdot{width:8px;height:8px;border-radius:50%;background:#eee;transition:background .3s}
.dpdot.dn{background:var(--pk)}
.dpdot.cu{background:var(--pu)}
.dbody{padding:14px 16px}
.dwtit{font-size:13px;font-weight:800;color:var(--pk);margin-bottom:7px}
.dtxt{font-size:14px;color:#444;line-height:1.95;min-height:60px;white-space:pre-wrap}
.dtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.dtag{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.dtag.up{background:#e8f8ee;color:var(--gn)}
.dtag.dn2{background:#ffe8e8;color:var(--rd)}
.dtag.mn{background:#fff3e0;color:#e67e22}
.dtag.ss{background:#fff0f0;color:var(--rd)}
.dftr{padding:9px 16px 13px;display:flex;justify-content:flex-end;gap:7px;border-top:1px solid #f5f5f5;flex-wrap:wrap}
.dnbtn{background:var(--pk);color:#fff;border:none;border-radius:20px;padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.dnbtn:hover{filter:brightness(1.08)}

/* 엔딩 */
#se{min-height:100vh;justify-content:center;padding:28px 14px;background:linear-gradient(135deg,#ffe4f0,#f0e4ff)}
.ebox{background:#fff;border-radius:30px;padding:34px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(200,130,170,.3)}
.efw{font-size:20px;letter-spacing:4px;margin-bottom:9px;animation:pp 1s infinite alternate}
@keyframes pp{from{transform:scale(1)}to{transform:scale(1.1)}}
.ending-img{width:200px;height:200px;object-fit:cover;border-radius:16px;margin-bottom:12px;box-shadow:var(--sh)}
.eico{font-size:56px;margin-bottom:6px}
.etit{font-size:24px;font-weight:800;color:var(--pu);margin-bottom:5px}
.esub{font-size:12px;color:#ffadc5;font-weight:700;margin-bottom:12px}
.edesc{font-size:13px;color:#666;line-height:1.9;margin-bottom:16px}
.estats{text-align:left;background:var(--pkl);border-radius:12px;padding:12px;margin-bottom:18px}
.estats p{font-size:12px;margin-bottom:4px}
.ebtns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* 모달 */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:center;justify-content:center;padding:14px}
.mov.show{display:flex}
.mbox{background:#fff;border-radius:24px;padding:26px 20px;max-width:370px;width:100%;box-shadow:0 8px 50px rgba(0,0,0,.22);text-align:center;animation:pi .25s ease;max-height:90vh;overflow-y:auto}
@keyframes pi{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.mico{font-size:48px;margin-bottom:9px}
.mtit{font-size:16px;font-weight:800;margin-bottom:7px;color:var(--pu)}
.mdesc{font-size:13px;color:#555;line-height:1.8;margin-bottom:13px;white-space:pre-wrap}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#ffb6c1;border-radius:10px}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<!-- 타이틀 화면 -->
<div id="st" class="screen active">
  <div class="tbox">
    <img src="imgs/title.png" class="tlogo-img" alt="하랑이메이커"
         onerror="this.style.display='none';document.getElementById('tlogo-fallback').style.display='block'">
    <div id="tlogo-fallback" style="font-size:72px;margin-bottom:8px;animation:bnc 2s infinite;display:none">👧</div>
    <div class="tname">하랑이메이커</div>
    <div class="tsub">10살 하랑이의 1년 성장 이야기 💕<br>과연 어떤 멋진 어른이 될까요? 🦋</div>
    <div class="tbtns">
      <button class="btn bp" id="btnstart" onclick="startNew()">🎮 새 게임 시작!</button>
      <button class="btn bu" id="btncont" style="display:none" onclick="loadG()">💾 이어서 하기</button>
      <button class="btn bg2" onclick="showAlbum()">📖 엔딩 앨범 보기</button>
    </div>
  </div>
</div>

<!-- 앨범 화면 -->
<div id="sa" class="screen">
  <h2 style="color:var(--pu);margin-bottom:5px">📖 하랑이의 엔딩 앨범</h2>
  <div class="abadge">✨ 달성: <span id="acnt">0</span> / <span id="atot">0</span></div>
  <div class="agrid" id="agrid" style="margin-top:12px"></div>
  <br>
  <button class="btn bp" onclick="goScreen('st');checkCont()">🏠 타이틀로</button>
</div>

<!-- 게임 화면 -->
<div id="sg" class="screen">
  <div class="gw">

    <!-- 상단 날짜/돈 -->
    <div class="topbar">
      <div id="uidate">🗓 1월</div>
      <div id="uimoney">💰 5,000원</div>
    </div>

    <!-- 알림 배너 -->
    <div class="abanner" id="abanner"></div>

    <!-- ★ 계절/바캉스 하랑이 이미지 배너 -->
    <div class="season-banner" id="seasonBanner">
      <img id="seasonImg" src="" alt="하랑이 일러스트"
           onerror="this.style.display='none';document.getElementById('seasonFallback').style.display='block'">
      <div id="seasonFallback" class="season-fallback" style="display:none">🌸</div>
    </div>

    <!-- ★ 아르바이트 이미지 배너 -->
    <div class="work-img-banner" id="workImgBanner">
      <img id="workImg" src="" alt="아르바이트 하랑이"
           onerror="this.style.display='none'">
    </div>

    <!-- 캐릭터 카드 -->
    <div class="ccard">
      <div class="cavt" id="cavt">👧</div>
      <div class="cinfo">
        <div class="cname">하랑이 💕</div>
        <div class="csub" id="csub">기분 좋음</div>
        <div class="cmono" id="cmono">오늘도 열심히 해볼까!</div>
      </div>
    </div>

    <!-- ★ 스테이터스 카드 — 기본 접힘 -->
    <div class="stcard">
      <div class="stcard-header" onclick="toggleStatus()">
        <div class="sttitle">📊 스테이터스 (눌러서 확인)</div>
        <button class="st-toggle-btn" id="stToggleBtn">▼</button>
      </div>
      <div class="stbody" id="stbody">
        <div class="stgrid" id="stgrid"></div>
        <div class="ssrow">
          <div class="sslb">😰 스트레스</div>
          <div class="ssbw"><div class="ssb" id="ssb" style="width:0%"></div></div>
          <div class="ssv" id="ssv">0</div>
        </div>
      </div>
    </div>

    <!-- 스케줄 카드 -->
    <div class="schcard" id="schcard">
      <div class="schtit" id="schtit">📅 이달의 스케줄</div>
      <div class="mcal" id="mcal"></div>
      <div class="spick">
        <div class="sptit" id="sptit">1주차 일정을 선택하세요</div>
        <div class="sptabs">
          <button class="sptab active" id="ptw" onclick="switchTab('work')">💼 알바</button>
          <button class="sptab" id="pte" onclick="switchTab('edu')">📚 교육</button>
          <button class="sptab" id="ptr" onclick="switchTab('rest')">🛋 휴식</button>
        </div>
        <div class="splist" id="splist"></div>
      </div>
      <div class="schsum" id="schsum">0 / 4주 선택됨</div>
      <div class="approw">
        <button class="btn bp bs" id="appbtn" onclick="approveSchedule()" disabled>
          📋 이달 스케줄 확정!
        </button>
      </div>
    </div>

    <!-- 로그 -->
    <div class="logcard" id="logcard"></div>

    <!-- 저장/타이틀 -->
    <div class="svrow">
      <button class="btn bu bs" onclick="saveG()">💾 저장</button>
      <button class="btn bg2 bs" onclick="confirmTitle()">🏠 타이틀</button>
    </div>

  </div>
</div>

<!-- 엔딩 화면 -->
<div id="se" class="screen">
  <div class="ebox">
    <div class="efw" id="efw">🎉🎊🎉🎊🎉</div>
    <img id="ending-img" src="" class="ending-img" alt="" style="display:none"
         onerror="this.style.display='none'">
    <div class="eico" id="eico">🌟</div>
    <div class="etit" id="etit">엔딩</div>
    <div class="esub" id="esub"></div>
    <div class="edesc" id="edesc"></div>
    <div class="estats" id="estats"></div>
    <div class="ebtns">
      <button class="btn bp" onclick="goScreen('st');checkCont()">🔄 다시 하기</button>
      <button class="btn bu" onclick="showAlbum()">📖 앨범 보기</button>
    </div>
  </div>
</div>

<!-- 대화창 오버레이 -->
<div class="dov" id="dov">
  <div class="dbox">
    <div class="dhdr">
      <div class="dface" id="dface">👧</div>
      <div class="dhinfo">
        <div class="dhname">하랑이</div>
        <div class="dhlb" id="dhlb">1월 1주차</div>
      </div>
      <div class="dprog" id="dprog"></div>
    </div>
    <div class="dbody">
      <div class="dwtit" id="dwtit"></div>
      <div class="dtxt" id="dtxt"></div>
      <div class="dtags" id="dtags"></div>
    </div>
    <div class="dftr" id="dftr">
      <button class="dnbtn" onclick="dlgNext()">다음 ▶</button>
    </div>
  </div>
</div>

<!-- 공용 모달 -->
<div class="mov" id="mov">
  <div class="mbox">
    <div class="mico" id="mico">✨</div>
    <div class="mtit" id="mtit"></div>
    <div class="mdesc" id="mdesc"></div>
    <div class="mbtns" id="mbtns"></div>
  </div>
</div>

  if(g.stress>=85)                return '😵';
  if(g.stress>=70)                return '😵‍💫';
  if(g.ailment==='hospitalized')  return '🤒';
  if(g.ailment==='sick')          return '😷';
  if(g.ailment==='princess')      return '🥰';
  if(g.ailment==='burnout')       return '😩';
  if(g.ailment==='shy')           return '😶';
  if(g.ailment==='fight')         return '😤';
  var hp=g.stats.hp||0, ch=g.stats.charm||0;
  if(hp>=70&&ch>=60) return '😄';
  if(hp>=50)         return '🙂';
  if(hp>=30)         return '😐';
  return '😟';
}

function getCharSub(g){
  if(!g) return '';
  if(g.hasBoyfriend)                   return '💕 남자친구 생김!';
  if(g.stress>=85)                     return '🤯 극한의 스트레스...';
  if(g.stress>=70)                     return '많이 지쳐있어요';
  if(g.ailment&&AILMENTS[g.ailment])   return AILMENTS[g.ailment].name;
  if(g.stats.hp>=70)                   return '💪 컨디션 최고!';
  if(g.stats.hp>=40)                   return '😊 기분 좋음';
  return '좀 피곤해요';
}

function getStatName(key){
  for(var i=0;i<SD.length;i++){if(SD[i].key===key)return SD[i].name;}
  return key;
}

function getRandLine(arr){
  if(!arr||!arr.length) return '';
  return arr[Math.floor(Math.random()*arr.length)];
}

// ★ 계절/바캉스 배너 업데이트
function updateSeasonBanner(month, vacKey){
  var img      = document.getElementById('seasonImg');
  var fallback = document.getElementById('seasonFallback');
  var banner   = document.getElementById('seasonBanner');
  if(!img||!fallback||!banner) return;

  var src = vacKey && VAC_IMGS[vacKey]
    ? VAC_IMGS[vacKey]
    : (SEASON_IMGS[month]||'imgs/img_spring_star.png');

  img.style.display    = 'block';
  fallback.style.display = 'none';
  img.src = src;
  img.onerror = function(){
    this.style.display='none';
    fallback.textContent = SEASON_FALLBACK[month]||'🌸';
    fallback.style.display='block';
  };
}

// ★ 아르바이트 이미지 배너 업데이트
function updateWorkBanner(workKey){
  var banner = document.getElementById('workImgBanner');
  var img    = document.getElementById('workImg');
  if(!banner||!img) return;
  if(workKey && WORK_IMGS[workKey]){
    img.src = WORK_IMGS[workKey];
    img.onerror = function(){ banner.classList.remove('show'); };
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

// ★ 스테이터스 접기/펼치기
function toggleStatus(){
  var body = document.getElementById('stbody');
  var btn  = document.getElementById('stToggleBtn');
  if(!body||!btn) return;
  var open = body.classList.contains('open');
  if(open){ body.classList.remove('open'); btn.classList.remove('open'); }
  else    { body.classList.add('open');    btn.classList.add('open');    }
}

    var numDiv=document.createElement('div');

      icoDiv.className='wsico';

      nmDiv.textContent=sch.name||'';
      slot.appendChild(nmDiv);
    } else {
      var emDiv=document.createElement('div');
      emDiv.className='wsem';
      emDiv.textContent='미선택';

function selectWeek(w){

  renderPickerPanel();
}

function switchTab(tab){
  G.pickerTab=tab;
  var tabs=['work','edu','rest'];
  var ids=['ptw','pte','ptr'];
  for(var i=0;i<tabs.length;i++){
    var el=document.getElementById(ids[i]);
    if(el) el.classList.toggle('active',tabs[i]===tab);
  }
  renderPickerPanel();
}

function renderPickerPanel(){
  var list=document.getElementById('splist');
  if(!list) return;
  list.innerHTML='';
  var tab=G.pickerTab||'work';
  var items=[];

  if(tab==='work'){
    for(var i=0;i<WORKS.length;i++){
      var w=WORKS[i];
      if(w.minMonth&&G.month<w.minMonth) continue;
      items.push({
        icon:getWorkIcon(w.key),
        name:w.name,
        info:'💰 '+w.pay.toLocaleString()+'원',
        id:'work_'+w.key,
        key:w.key,
        type:'work',
        data:w,
        locked:false
      });
    }
  } else if(tab==='edu'){
    for(var i=0;i<EDUS.length;i++){
      var e=EDUS[i];
      var locked=(e.cost>0&&G.money<e.cost);
      items.push({
        icon:getEduIcon(e.key),
        name:e.name,
        info:e.cost>0?'💸 '+e.cost.toLocaleString()+'원':'무료',
        id:'edu_'+e.key,
        key:e.key,
        type:'edu',
        data:e,
        locked:locked
      });
    }
  } else {
    for(var i=0;i<RESTS.length;i++){
      var r=RESTS[i];
      if(r.isVacation){
        var vacItems=getAvailableVacations();
        if(vacItems.length===0) continue;
        items.push({
          icon:'✈️',
          name:'✈️ 바캉스 가기',
          info:'여행지 선택',
          id:'rest_vacation',
          key:'vacation',
          type:'rest',
          data:r,
          locked:false,
          isVacation:true
        });
      } else {
        var locked=(r.cost>0&&G.money<r.cost);
        items.push({
          icon:getRestIcon(r.key),
          name:r.name,
          info:r.cost>0?'💸 '+r.cost.toLocaleString()+'원':'무료',
          id:'rest_'+r.key,
          key:r.key,
          type:'rest',
          data:r,
          locked:locked
        });
      }
    }
  }

  for(var i=0;i<items.length;i++){
    var it=items[i];
    var div=document.createElement('div');
    div.className='spitem'+(it.locked?' lkit':'');
    div.onclick=(function(item){
      return function(){
        if(item.locked) return;
        if(item.isVacation){showVacationPicker();}
        else{pickSchedule(item);}
      };
    })(it);
    div.innerHTML=
      '<div class="spil">'+
        '<div class="spinm">'+(it.icon?' ':'')+it.name+'</div>'+
        '<div class="spiin">'+getEffectStr(it.data)+'</div>'+
      '</div>'+
      '<div class="spir">'+(it.locked?'💰부족':it.info)+'</div>';
    list.appendChild(div);
  }
}

function getAvailableVacations(){
  var out=[];
  for(var i=0;i<VACATIONS.length;i++){
    var v=VACATIONS[i];
    if(v.month.indexOf(G.month)>=0&&G.money>=v.cost) out.push(v);
  }
  return out;
}

function pickVacation(vacKey){

function updateApproveBtn(){

function getEffectStr(data){
  if(!data) return '';
  var parts=[];
  var ef=data.effects||{};
  for(var k in ef){
    if(ef[k]>0) parts.push(getStatName(k)+' +'+ef[k]);
    else if(ef[k]<0) parts.push(getStatName(k)+' '+ef[k]);
  }
  if(data.stress!==undefined){
    if(data.stress>0) parts.push('스트레스 +'+data.stress);
    else if(data.stress<0) parts.push('스트레스 '+data.stress);
  }
  if(data.stressMod!==undefined){
    if(data.stressMod>0) parts.push('스트레스 +'+data.stressMod);
    else if(data.stressMod<0) parts.push('스트레스 '+data.stressMod);
  }
  return parts.slice(0,3).join(' · ');
}

function approveSchedule(){
  var filled=0;
  for(var i=0;i<4;i++){if(G.monthSchedule[i]!==null) filled++;}
  if(filled<4){showToast('4주 스케줄을 모두 선택해주세요!');return;}
  DQ=[];DI=0;
  buildDialogQueue();
  showDlg();
}

function buildDialogQueue(){
  for(var w=0;w<4;w++){
    var sch=G.monthSchedule[w];
    if(!sch) continue;
    DQ.push({type:'week',week:w+1,sch:sch});
  }
  // 랜덤 이벤트
  for(var i=0;i<EVENTS.length;i++){
    if(Math.random()<EVENTS[i].prob){
      DQ.push({type:'event',ev:EVENTS[i]});
      break;
    }
  }
  // 남자친구 이벤트
  if(G.hasBoyfriend){
    for(var i=0;i<BF_EVENTS.length;i++){
      if(Math.random()<BF_EVENTS[i].prob){
        DQ.push({type:'bfevent',ev:BF_EVENTS[i]});
        break;
      }
    }
  }
  // 남자친구 생기는 이벤트
  if(!G.hasBoyfriend&&G.stats.charm>=35&&G.month>=3&&Math.random()<0.08){
    DQ.push({type:'boyfriend'});
  }
  // 상태이상 체크
  if(G.stress>=75&&!G.ailment&&Math.random()<0.3){
    var ails=['burnout','princess','shy'];
    DQ.push({type:'ailment',ailKey:ails[Math.floor(Math.random()*ails.length)]});
  }
  // 월말 결산
  DQ.push({type:'monthend'});
}

function calcWeekResult(sch){
  var res={statChanges:{},moneyDelta:0,stressDelta:0,desc:''};
  var data=sch.data||{};

  if(sch.type==='work'){
    res.moneyDelta=data.pay||0;
    res.stressDelta=data.stress||0;
    var ef=data.effects||{};
    for(var k in ef) res.statChanges[k]=(res.statChanges[k]||0)+ef[k];
    res.desc=data.desc||'열심히 일했어요!';
    G.workCount[sch.key]=(G.workCount[sch.key]||0)+1;
    updateWorkBanner(sch.key);
  } else if(sch.type==='edu'){
    res.moneyDelta=-(data.cost||0);
    res.stressDelta=data.stress||0;
    var ef=data.effects||{};
    for(var k in ef) res.statChanges[k]=(res.statChanges[k]||0)+ef[k];
    res.desc=data.desc||'열심히 공부했어요!';
    G.eduCount[sch.key]=(G.eduCount[sch.key]||0)+1;
  } else if(sch.type==='rest'){
    res.moneyDelta=-(data.cost||0);
    res.stressDelta=data.stress||0;
    var ef=data.effects||{};
    for(var k in ef) res.statChanges[k]=(res.statChanges[k]||0)+ef[k];
    res.desc=data.desc||'푹 쉬었어요!';
  } else if(sch.type==='vacation'){
    res.moneyDelta=-(data.cost||0);
    res.stressDelta=data.stressMod||0;
    var ef=data.effects||{};
    for(var k in ef) res.statChanges[k]=(res.statChanges[k]||0)+ef[k];
    res.desc=data.desc||'신나는 바캉스!';
    G.vacationCount=(G.vacationCount||0)+1;
    updateSeasonBanner(G.month,sch.key);
  }

  // 상태이상 패널티
  if(G.ailment&&AILMENTS[G.ailment]){
    var mod=AILMENTS[G.ailment].statMod||{};
    for(var k in mod) res.statChanges[k]=(res.statChanges[k]||0)+mod[k];
    res.stressDelta+=AILMENTS[G.ailment].stressMod||0;
  }

  return res;
}

function applyWeekResult(res){
  G.money=Math.max(0,G.money+(res.moneyDelta||0));
  G.stress=clamp((G.stress||0)+(res.stressDelta||0),0,100);
  for(var k in res.statChanges){
    G.stats[k]=clamp((G.stats[k]||0)+res.statChanges[k],0,SMAX);
  }
}

// ══════════════════════════════════════════
//  대화창
// ══════════════════════════════════════════
function showDlg(){
  document.getElementById('dov').classList.add('show');
  DI=0;
  renderDlgEntry();
}

function closeDlg(){
  document.getElementById('dov').classList.remove('show');
}

function dlgNext(){
  DI++;
  if(DI>=DQ.length){
    closeDlg();
    return;
  }
  renderDlgEntry();
}

function renderDlgEntry(){
  if(DI>=DQ.length){closeDlg();return;}
  var entry=DQ[DI];

  // 진행 도트
  var prog=document.getElementById('dprog');
  if(prog){
    prog.innerHTML='';
    for(var i=0;i<DQ.length;i++){
      var dot=document.createElement('div');
      dot.className='dpdot'+(i<DI?' dn':'')+(i===DI?' cu':'');
      prog.appendChild(dot);
    }
  }

  var dhlb=document.getElementById('dhlb');
  var dwtit=document.getElementById('dwtit');
  var dtxt=document.getElementById('dtxt');
  var dtags=document.getElementById('dtags');
  var dftr=document.getElementById('dftr');
  var dface=document.getElementById('dface');

  if(dhlb) dhlb.textContent=MN[G.month-1];
  if(dtags) dtags.innerHTML='';
  if(dftr) dftr.innerHTML='<button class="dnbtn" onclick="dlgNext()">다음 ▶</button>';

  if(entry.type==='week'){
    var res=calcWeekResult(entry.sch);
    applyWeekResult(res);
    renderTopBar();
    renderStats();

    if(dface) dface.textContent=getAvatar(G);
    if(dwtit) dwtit.textContent=entry.week+'주차 — '+entry.sch.name;
    if(dtxt)  dtxt.textContent=res.desc;

    // 스탯 태그
    if(dtags){
      for(var k in res.statChanges){
        if(res.statChanges[k]===0) continue;
        var tag=document.createElement('span');
        tag.className='dtag '+(res.statChanges[k]>0?'up':'dn2');
        tag.textContent=getStatName(k)+' '+(res.statChanges[k]>0?'+':'')+res.statChanges[k];
        dtags.appendChild(tag);
      }
      if(res.moneyDelta!==0){
        var tag=document.createElement('span');
        tag.className='dtag '+(res.moneyDelta>0?'up':'dn2');
        tag.textContent=(res.moneyDelta>0?'+':'')+res.moneyDelta.toLocaleString()+'원';
        dtags.appendChild(tag);
      }
      if(res.stressDelta!==0){
        var tag=document.createElement('span');
        tag.className='dtag '+(res.stressDelta>0?'ss':'up');
        tag.textContent='스트레스 '+(res.stressDelta>0?'+':'')+res.stressDelta;
        dtags.appendChild(tag);
      }
    }

    addLog(entry.week+'주: '+entry.sch.name+' → '+res.desc,
      res.moneyDelta>0?'good':(res.stressDelta>10?'bad':''));

    // 아르바이트 이미지
    if(entry.sch.type==='work') updateWorkBanner(entry.sch.key);
    else updateWorkBanner(null);

  } else if(entry.type==='event'){
    var ev=entry.ev;
    // 이벤트 적용
    if(ev.effects){
      for(var k in ev.effects) G.stats[k]=clamp((G.stats[k]||0)+ev.effects[k],0,SMAX);
    }
    if(ev.stress) G.stress=clamp(G.stress+ev.stress,0,100);
    if(ev.moneyDelta) G.money=Math.max(0,G.money+ev.moneyDelta);
    if(ev.ailment) setAilment(ev.ailment);
    renderTopBar();renderStats();

    if(dface) dface.textContent='✨';
    if(dwtit) dwtit.textContent='이벤트! '+ev.name;
    if(dtxt)  dtxt.textContent=ev.msg;
    addLog('✨ '+ev.name,'event');

  } else if(entry.type==='bfevent'){
    var ev=entry.ev;
    if(ev.effects){
      for(var k in ev.effects) G.stats[k]=clamp((G.stats[k]||0)+ev.effects[k],0,SMAX);
    }
    if(ev.stress) G.stress=clamp(G.stress+ev.stress,0,100);
    if(ev.breakup) G.hasBoyfriend=false;
    renderTopBar();renderStats();

    if(dface) dface.textContent='💕';
    if(dwtit) dwtit.textContent='남자친구 이벤트';
    if(dtxt)  dtxt.textContent=ev.msg;
    addLog('💕 '+ev.msg,'event');

  } else if(entry.type==='boyfriend'){
    G.hasBoyfriend=true;
    if(dface) dface.textContent='💘';
    if(dwtit) dwtit.textContent='두근두근 고백!';
    if(dtxt)  dtxt.textContent='하랑이에게 좋아한다고 고백한 친구가 생겼어요!\n남자친구가 생겼습니다 💕';
    addLog('💘 남자친구가 생겼어요!','event');

  } else if(entry.type==='ailment'){
    setAilment(entry.ailKey);
    var ail=AILMENTS[entry.ailKey];
    if(dface) dface.textContent='😰';
    if(dwtit) dwtit.textContent='상태이상 발생!';

    // ★ 상태이상 이미지
    var imgEl=document.getElementById('dtxt');
    if(imgEl&&ail&&ail.img){
      imgEl.innerHTML='<img src="'+ail.img+'" class="ailment-popup-img" '+
        'onerror="this.style.display=\'none\'"'+
        ' alt="'+ail.name+'"> '+ail.desc;
    } else {
      if(dtxt) dtxt.textContent=ail?ail.desc:'상태이상이 발생했어요...';
    }
    addLog('😰 '+( ail?ail.name:'상태이상')+'이 발생했어요!','bad');

  } else if(entry.type==='monthend'){
    // 월말 처리
    finishMonth();
    closeDlg();
    return;
  }
}

// ══════════════════════════════════════════
//  상태이상
// ══════════════════════════════════════════
function setAilment(key){
  G.ailment=key;
  G.ailmentMonths=2;
}

function tickAilment(){
  if(!G.ailment) return;
  G.ailmentMonths--;
  if(G.ailmentMonths<=0){
    addLog('✅ '+( AILMENTS[G.ailment]?AILMENTS[G.ailment].name:'상태이상')+'이 회복됐어요!','good');
    G.ailment=null;
    G.ailmentMonths=0;
  }
}

function skipHospital(){
  G.ailment=null;
  G.ailmentMonths=0;
  addLog('🏥 퇴원했어요! 다시 시작해봐요.','good');
  G.month++;
  if(G.month>12){triggerEnding();return;}
  G.monthSchedule=[null,null,null,null];
  G.selectingWeek=0;
  renderAll();
}

// ══════════════════════════════════════════
//  월말 처리
// ══════════════════════════════════════════
function finishMonth(){
  tickAilment();

  // 스트레스 자연 감소
  G.stress=clamp(G.stress-5,0,100);

  // 번아웃 체크
  if(G.stress>=95&&G.stats.hp<=8){
    triggerBadEnding();
    return;
  }

  // 다음 달로
  G.month++;
  if(G.month>12){
    triggerEnding();
    return;
  }

  // 초기화
  G.monthSchedule=[null,null,null,null];
  G.selectingWeek=0;
  G.pickerTab='work';

  updateSeasonBanner(G.month,null);
  updateWorkBanner(null);
  renderAll();
  addLog('🗓 '+MN[G.month-1]+'이 시작됐어요!','event');
  saveG();
}

// ══════════════════════════════════════════
//  엔딩 처리
// ══════════════════════════════════════════
function triggerEnding(){
  // 히든 엔딩 우선 체크
  var chosen=null;
  for(var i=0;i<ENDINGS.length;i++){
    if(ENDINGS[i].cond(G)){chosen=ENDINGS[i];break;}
  }
  if(!chosen) chosen=ENDINGS[ENDINGS.length-1];

  unlockEnding(chosen.id);
  showEndingScreen(chosen);
}

function triggerBadEnding(){
  unlockEnding(BAD_ENDING.id);
  showEndingScreen(BAD_ENDING);
}

function showEndingScreen(ending){
  goScreen('se');

  var efw=document.getElementById('efw');
  if(efw) efw.textContent=ending.rare&&ending.rare.indexOf('히든')>=0
    ?'🌟✨🌟✨🌟':'🎉🎊🎉🎊🎉';

  // 엔딩 이미지
  var eimg=document.getElementById('ending-img');
  if(eimg){
    var src=ENDING_IMGS[ending.id]||'';
    if(src){
      eimg.src=src;
      eimg.style.display='block';
      eimg.onerror=function(){this.style.display='none';};
    } else {
      eimg.style.display='none';
    }
  }

  var eico=document.getElementById('eico');
  if(eico) eico.textContent=ending.icon||'🌟';

  var etit=document.getElementById('etit');
  if(etit) etit.textContent=ending.name||'엔딩';

  var esub=document.getElementById('esub');
  if(esub) esub.textContent=(ending.rare||'')+(ending.sub?' — '+ending.sub:'');

  var edesc=document.getElementById('edesc');
  if(edesc) edesc.textContent=ending.desc||'';

  // 최종 스탯 요약
  var estats=document.getElementById('estats');
  if(estats){
    var html='<p><strong>📊 최종 스탯</strong></p>';
    for(var i=0;i<SD.length;i++){
      var v=G.stats[SD[i].key]||0;
      html+='<p>'+SD[i].name+': <strong>'+v+'</strong></p>';
    }
    html+='<p>💰 최종 잔액: <strong>'+G.money.toLocaleString()+'원</strong></p>';
    html+='<p>😰 최종 스트레스: <strong>'+G.stress+'</strong></p>';
    estats.innerHTML=html;
  }
}

// ══════════════════════════════════════════
//  앨범
// ══════════════════════════════════════════
function unlockEnding(id){
  var arr=JSON.parse(localStorage.getItem('harang_unlocked')||'[]');
  if(arr.indexOf(id)<0){
    arr.push(id);
    localStorage.setItem('harang_unlocked',JSON.stringify(arr));
  }
}

function showAlbum(){
  var allEndings=ENDINGS.concat([BAD_ENDING]);
  var unlocked=JSON.parse(localStorage.getItem('harang_unlocked')||'[]');
  var acnt=document.getElementById('acnt');
  var atot=document.getElementById('atot');
  if(acnt) acnt.textContent=unlocked.length;
  if(atot) atot.textContent=allEndings.length;
  var grid=document.getElementById('agrid');
  if(!grid) return;
  grid.innerHTML='';

  for(var i=0;i<allEndings.length;i++){
    var e=allEndings[i];
    var isUnlocked=(unlocked.indexOf(e.id)>=0);
    var card=document.createElement('div');
    card.className='acard'+(isUnlocked?'':' lk');

    if(isUnlocked){
      var imgSrc=ENDING_IMGS[e.id]||'';
      card.innerHTML=
        (imgSrc
          ?'<img src="'+imgSrc+'" class="acard-img" alt="'+e.name+'" onerror="this.style.display=\'none\'">'
          :'<div class="acard-lock" style="background:#fff0f5;font-size:32px;">'+e.icon+'</div>')+
        '<div class="en">'+e.icon+' '+e.name+'</div>'+
        '<div class="er">'+(e.rare||'')+'</div>'+
        '<div class="eh">'+(e.hint||'')+'</div>';
    } else {
      card.innerHTML=
        '<div class="acard-lock">🔒</div>'+
        '<div class="en" style="color:#ccc">???</div>'+
        '<div class="er">미해금</div>'+
        '<div class="eh">'+(e.hint||'')+'</div>';
    }
    grid.appendChild(card);
  }
  goScreen('sa');
}

// ══════════════════════════════════════════
//  토스트
// ══════════════════════════════════════════
function showToast(msg){
  var t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;
  t.style.display='block';
  clearTimeout(t._tmr);
  t._tmr=setTimeout(function(){t.style.display='none';},2200);
}

// ══════════════════════════════════════════
//  모달
// ══════════════════════════════════════════
function showModal(ico,tit,desc,btns){
  var mico=document.getElementById('mico');
  var mtit=document.getElementById('mtit');
  var mdesc=document.getElementById('mdesc');
  var mbtns=document.getElementById('mbtns');
  if(mico)  mico.textContent=ico||'✨';
  if(mtit)  mtit.textContent=tit||'';
  if(mdesc) mdesc.textContent=desc||'';
  if(mbtns){
    mbtns.innerHTML='';
    for(var i=0;i<btns.length;i++){
      (function(btn,idx){
        var b=document.createElement('button');
        b.className='btn '+(idx===0?'bp':'bu');
        b.textContent=btn.label||btn.text||'확인';
        b.onclick=function(){
          closeModal();
          if(btn.fn) btn.fn();
          else if(btn.cb) btn.cb();
        };
        mbtns.appendChild(b);
      })(btns[i],i);
    }
  }
  var mov=document.getElementById('mov');
  if(mov) mov.classList.add('show');
}

function closeModal(){
  var mov=document.getElementById('mov');
  if(mov) mov.classList.remove('show');
}
window.onload=function(){
  checkCont();
};
</script>
