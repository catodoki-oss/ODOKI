<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하랑이 키우기 🌸</title>
<style>
:root {
  --pk: #ff7da1;
  --pkl: #fff0f5;
  --pu: #9b7fe8;
  --pul: #f3eeff;
  --bg: #fff8fb;
  --tx: #4a3f5c;
  --ca: #fff;
  --sh: 0 4px 18px rgba(200,130,170,.18);
  --ra: 18px;
  --rd: #ff6b6b;
  --gn: #5cc87a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--tx); min-height: 100vh; }
.btn { display: inline-block; padding: 10px 22px; border-radius: 50px; border: none; cursor: pointer; font-size: 14px; font-weight: 700; font-family: inherit; transition: all .18s; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.07); }
.bp { background: var(--pk); color: #fff; }
.bu { background: var(--pu); color: #fff; }
.bg2 { background: #ddd; color: #666; }
.bs { padding: 6px 14px; font-size: 12px; }
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* 타이틀 */
#st { justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #ffe4f0, #f5e4ff, #e4f0ff); }
.tbox { text-align: center; padding: 0; background: rgba(255,255,255,.93); border-radius: 32px; box-shadow: 0 8px 40px rgba(200,130,170,.25); max-width: 400px; width: 92%; overflow: hidden; }
.ttitle-img { width: 100%; display: block; border-radius: 32px 32px 0 0; }
.ttitle-btns-area { padding: 20px 28px 28px; }
.tsub { font-size: 13px; color: #aaa; margin-bottom: 18px; line-height: 1.7; }
.tbtns { display: flex; flex-direction: column; gap: 11px; }

/* 앨범 */
#sa { min-height: 100vh; padding: 24px 14px 40px; gap: 12px; background: linear-gradient(135deg, #ffe4f0, #f0e4ff); }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 9px; width: 100%; max-width: 680px; }
.acard { background: #fff; border-radius: 14px; padding: 12px 7px; text-align: center; box-shadow: var(--sh); display: flex; flex-direction: column; align-items: center; min-height: 128px; transition: transform .18s; }
.acard:hover { transform: translateY(-3px); }
.acard.lk { filter: grayscale(1); opacity: .35; }
.ei { font-size: 24px; margin-bottom: 4px; }
.en { font-size: 11px; font-weight: 700; line-height: 1.4; }
.er { font-size: 10px; color: var(--pk); margin-top: 3px; }
.eh { font-size: 9px; color: #bbb; margin-top: 4px; line-height: 1.4; font-style: italic; }
.abadge { background: var(--pk); color: #fff; padding: 3px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }

/* 게임 화면 */
#sg { min-height: 100vh; background: var(--bg); align-items: stretch; }
.gw { display: flex; flex-direction: column; width: 100%; max-width: 540px; margin: 0 auto; padding: 13px 13px 28px; gap: 9px; }
.topbar { background: linear-gradient(90deg, var(--pk), var(--pu)); color: #fff; border-radius: var(--ra); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
.abanner { background: #fff3cd; border: 2px solid #ffc107; border-radius: 11px; padding: 8px 13px; font-size: 12px; font-weight: 700; color: #856404; display: none; }
.abanner.show { display: block; }
.ccard { background: var(--ca); border-radius: var(--ra); box-shadow: var(--sh); padding: 13px; display: flex; gap: 13px; align-items: center; }
.cavt { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, #ffe4f0, #f0e4ff); display: flex; align-items: center; justify-content: center; font-size: 48px; border: 3px solid var(--pk); flex-shrink: 0; }
.cinfo { flex: 1; }
.cname { font-size: 16px; font-weight: 800; color: var(--pu); }
.csub { font-size: 11px; color: #bbb; margin-top: 2px; margin-bottom: 4px; }
.cmono { font-size: 12px; color: #777; font-style: italic; background: var(--pkl); border-radius: 9px; padding: 6px 10px; line-height: 1.6; min-height: 34px; }
.stcard { background: var(--ca); border-radius: var(--ra); box-shadow: var(--sh); padding: 12px 14px; }
.sttitle { font-size: 12px; font-weight: 700; color: #bbb; margin-bottom: 9px; }
.stgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.strow { display: flex; align-items: center; gap: 5px; }
.stlb { font-size: 11px; width: 38px; flex-shrink: 0; font-weight: 700; }
.stbw { flex: 1; background: #f0f0f0; border-radius: 10px; height: 7px; overflow: hidden; }
.stb { height: 100%; border-radius: 10px; transition: width .4s; }
.stv { font-size: 11px; width: 22px; text-align: right; font-weight: 700; }
.ssrow { margin-top: 9px; padding-top: 8px; border-top: 1px solid #f5f5f5; display: flex; align-items: center; gap: 6px; }
.sslb { font-size: 11px; font-weight: 700; color: var(--rd); width: 54px; flex-shrink: 0; }
.ssbw { flex: 1; background: #ffe0e0; border-radius: 10px; height: 8px; overflow: hidden; }
.ssb { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #ffb347, var(--rd)); transition: width .4s; }
.ssv { font-size: 11px; font-weight: 700; color: var(--rd); width: 22px; text-align: right; }

/* 스케줄 카드 */
.schcard { background: var(--ca); border-radius: var(--ra); box-shadow: var(--sh); padding: 13px; }
.schtit { font-size: 13px; font-weight: 800; color: var(--pu); margin-bottom: 9px; text-align: center; }
.mcal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 11px; }
.wslot { border-radius: 11px; border: 2px solid #f0f0f0; padding: 7px 3px; text-align: center; cursor: pointer; transition: all .2s; background: #fafafa; min-height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.wslot:hover { border-color: var(--pk); background: var(--pkl); }
.wslot.sel { border-color: var(--pk); background: var(--pkl); }
.wslot.asel { border-color: var(--pu); background: var(--pul); }
.wsnum { font-size: 10px; font-weight: 800; color: #bbb; }
.wslot.sel .wsnum { color: var(--pk); }
.wslot.asel .wsnum { color: var(--pu); }
.wsico { font-size: 17px; }
.wsnm { font-size: 9px; font-weight: 700; line-height: 1.3; word-break: keep-all; }
.wsem { font-size: 9px; color: #ccc; }
.spick { background: var(--pkl); border-radius: 11px; padding: 9px; margin-bottom: 9px; }
.sptit { font-size: 11px; font-weight: 700; color: var(--pk); margin-bottom: 7px; }
.sptabs { display: flex; gap: 5px; margin-bottom: 7px; }
.sptab { flex: 1; padding: 5px; border-radius: 7px; border: none; background: #f0f0f0; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .18s; }
.sptab.active { background: var(--pk); color: #fff; }
.splist { display: flex; flex-direction: column; gap: 5px; max-height: 185px; overflow-y: auto; }
.spitem { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 8px; padding: 7px 9px; cursor: pointer; border: 2px solid transparent; transition: all .18s; }
.spitem:hover { border-color: var(--pk); }
.spitem.lkit { opacity: .38; cursor: not-allowed; pointer-events: none; }
.spil { flex: 1; }
.spinm { font-size: 12px; font-weight: 700; }
.spiin { font-size: 10px; color: #999; margin-top: 1px; }
.spir { font-size: 11px; font-weight: 700; color: var(--pu); white-space: nowrap; margin-left: 5px; }
.schsum { font-size: 11px; color: #888; text-align: center; margin-bottom: 7px; }
.approw { display: flex; gap: 8px; justify-content: center; }
#appbtn:disabled { opacity: .45; cursor: not-allowed; }
.logcard { background: var(--ca); border-radius: var(--ra); box-shadow: var(--sh); padding: 10px 13px; max-height: 95px; overflow-y: auto; }
.logi { font-size: 11px; color: #888; padding: 3px 0; border-bottom: 1px solid #f8f8f8; line-height: 1.5; }
.logi.good { color: var(--gn); }
.logi.bad { color: var(--rd); }
.logi.event { color: var(--pu); font-weight: 700; }
.svrow { display: flex; gap: 8px; justify-content: center; }

/* 대화창 */
.dov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 500; align-items: flex-end; justify-content: center; padding-bottom: 14px; }
.dov.show { display: flex; }
.dbox { background: #fff; border-radius: 20px; max-width: 490px; width: 96%; box-shadow: 0 -4px 30px rgba(0,0,0,.22); overflow: hidden; animation: sup .28s ease; }
@keyframes sup { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.dhdr { background: linear-gradient(135deg, #ffe4f0, #f0e4ff); padding: 13px 15px; display: flex; align-items: center; gap: 11px; border-bottom: 2px solid var(--pkl); }
.dface { font-size: 44px; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 50%; border: 3px solid var(--pk); flex-shrink: 0; }
.dhinfo { flex: 1; }
.dhname { font-size: 14px; font-weight: 800; color: var(--pu); }
.dhlb { font-size: 11px; color: #aaa; margin-top: 2px; }
.dprog { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; max-width: 80px; }
.dpdot { width: 8px; height: 8px; border-radius: 50%; background: #eee; transition: background .3s; }
.dpdot.dn { background: var(--pk); }
.dpdot.cu { background: var(--pu); }
.dbody { padding: 14px 16px; }
.dwtit { font-size: 13px; font-weight: 800; color: var(--pk); margin-bottom: 7px; }
.dtxt { font-size: 14px; color: #444; line-height: 1.95; min-height: 60px; white-space: pre-wrap; }
.dtags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 9px; }
.dtag { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 700; }
.dtag.up { background: #e8f8ee; color: var(--gn); }
.dtag.dn2 { background: #ffe8e8; color: var(--rd); }
.dtag.mn { background: #fff3e0; color: #e67e22; }
.dtag.ss { background: #fff0f0; color: var(--rd); }
.dftr { padding: 9px 16px 13px; display: flex; justify-content: flex-end; gap: 7px; border-top: 1px solid #f5f5f5; flex-wrap: wrap; }
.dnbtn { background: var(--pk); color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.dnbtn:hover { filter: brightness(1.08); }

/* 엔딩 */
#se { min-height: 100vh; justify-content: center; padding: 28px 14px; background: linear-gradient(135deg, #ffe4f0, #f0e4ff); }
.ebox { background: #fff; border-radius: 30px; padding: 34px 24px; max-width: 410px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(200,130,170,.3); }
.efw { font-size: 20px; letter-spacing: 4px; margin-bottom: 9px; animation: pp 1s infinite alternate; }
@keyframes pp { from { transform: scale(1); } to { transform: scale(1.1); } }
.eico { font-size: 72px; margin-bottom: 12px; }
.etit { font-size: 24px; font-weight: 800; color: var(--pu); margin-bottom: 5px; }
.esub { font-size: 12px; color: #ffadc5; font-weight: 700; margin-bottom: 12px; }
.edesc { font-size: 13px; color: #666; line-height: 1.9; margin-bottom: 16px; }
.estats { text-align: left; background: var(--pkl); border-radius: 12px; padding: 12px; margin-bottom: 18px; }
.estats p { font-size: 12px; margin-bottom: 4px; }
.ebtns { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }

/* 모달 */
.mov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 999; align-items: center; justify-content: center; padding: 14px; }
.mov.show { display: flex; }
.mbox { background: #fff; border-radius: 24px; padding: 26px 20px; max-width: 370px; width: 100%; box-shadow: 0 8px 50px rgba(0,0,0,.22); text-align: center; animation: pi .25s ease; max-height: 90vh; overflow-y: auto; }
@keyframes pi { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.mico { font-size: 48px; margin-bottom: 9px; }
.mtit { font-size: 16px; font-weight: 800; margin-bottom: 7px; color: var(--pu); }
.mdesc { font-size: 13px; color: #555; line-height: 1.8; margin-bottom: 13px; white-space: pre-wrap; }
.mbtns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #ffb6c1; border-radius: 10px; }
</style>
</head>

// ════════ 화면 전환 ════════
function goScreen(id) {
  var all = document.querySelectorAll('.screen');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
  var el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function confirmTitle() {
  if (confirm('타이틀로 돌아갈까요? 저장하지 않으면 진행이 사라집니다.')) {
    goScreen('st');
    checkCont();
  }
}

function checkCont() {
  var el = document.getElementById('btncont');
  if (el) el.style.display = localStorage.getItem('harang_save') ? 'inline-block' : 'none';
}

// ════════ 저장 / 불러오기 ════════
function saveG() {
  if (!G) return;
  localStorage.setItem('harang_save', JSON.stringify(G));
  showToast('💾 저장 완료!');
}

function loadG() {
  var raw = localStorage.getItem('harang_save');
  if (!raw) { alert('저장 데이터가 없어요!'); return; }
  try {
    G = JSON.parse(raw);
    goScreen('sg');
    rebuildSchCard();
    renderAll();
  } catch(e) {
    alert('저장 데이터가 손상되었습니다. 새 게임을 시작해주세요.');
    localStorage.removeItem('harang_save');
    checkCont();
  }
}

function startNew() {
  if (localStorage.getItem('harang_save')) {
    if (!confirm('새 게임을 시작하면 기존 저장이 사라집니다. 계속할까요?')) return;
  }
  G = newGame();
  localStorage.removeItem('harang_save');
  goScreen('sg');
  rebuildSchCard();
  renderAll();
  addLog('🌸 하랑이의 1년이 시작됩니다! 1월부터 시작해요.', 'event');
}

function renderStats() {

function renderCalendar() {

    slot.className = cls;

        '<div class="wsico">' + sch.icon + '</div>' +
        '<div class="wsnm">' + sch.name + '</div>';

function renderPickerPanel() {

  for (var i = 0; i < tabs.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) el.className = 'sptab' + (tabs[i] === tab ? ' active' : '');
  }

  if (sptit) sptit.textContent = '📌 ' + (G.selectingWeek + 1) + '주차 일정을 선택하세요';
  renderPickerList(tab);
  updateSummary();

function switchTab(tab) {
  G.pickerTab = tab;
  renderPickerPanel();
}

function renderPickerList(tab) {
  var list = document.getElementById('splist');
  if (!list) return;
  list.innerHTML = '';
  var items = [];
  if (tab === 'work') items = getWorkList(G.month);
  else if (tab === 'edu') items = EDU;
  else items = getRestList(G.month);

  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var canAfford = true;
    if (tab === 'edu' || tab === 'rest') {
      canAfford = G.money >= (item.cost || 0);
    }
    var rightText = '';
    if (tab === 'work') rightText = '+' + item.reward.toLocaleString() + '원';
    else if (tab === 'edu') rightText = '-' + (item.cost || 0).toLocaleString() + '원';
    else rightText = (item.cost > 0) ? '-' + item.cost.toLocaleString() + '원' : '무료';

    var el = document.createElement('div');
    el.className = 'spitem' + (canAfford ? '' : ' lkit');
    el.innerHTML =
      '<div class="spil">' +
      '<div class="spinm">' + item.icon + ' ' + item.name + '</div>' +
      '<div class="spiin">' + item.desc + '</div>' +
      '</div>' +
      '<div class="spir">' + rightText + '</div>';

    if (canAfford) {
      el.onclick = (function(it, tb) {
        return function() { assignSchedule(it, tb); };
      })(item, tab);
    }
    list.appendChild(el);
  }
}

function assignSchedule(item, tab) {
  var w = G.selectingWeek;
  var copy = {};
  for (var k in item) copy[k] = item[k];
  copy.tabType = tab;
  G.monthSchedule[w] = copy;

  var mono = item.mono ? item.mono[Math.floor(Math.random() * item.mono.length)] : '이거 해볼까~?';
  var monoEl = document.getElementById('cmono');
  if (monoEl) monoEl.textContent = '"' + mono + '"';

  var next = -1;
  for (var i = 0; i < 4; i++) {
    if (G.monthSchedule[i] === null) { next = i; break; }
  }
  if (next >= 0) G.selectingWeek = next;

  renderCalendar();
  updateSummary();
  updateApproveBtn();
}

function updateSummary() {
  var filled = 0;
  for (var i = 0; i < 4; i++) { if (G.monthSchedule[i] !== null) filled++; }
  var el = document.getElementById('schsum');
  if (el) el.textContent = filled + ' / 4주 선택됨';
}

function updateApproveBtn() {
  var filled = 0;
  for (var i = 0; i < 4; i++) { if (G.monthSchedule[i] !== null) filled++; }
  var btn = document.getElementById('appbtn');
  if (btn) {
    btn.disabled = (filled < 4);
    btn.style.opacity = filled < 4 ? '0.45' : '1';
  }
}

// ════════ 성공률 계산 ════════
function calcSuccessRate(sch) {
  var base = 50;
  var total = 0;
  for (var k in G.stats) total += G.stats[k];
  var avg = total / SD.length;
  var bonus = Math.floor(avg / 7);
  return Math.min(85, Math.max(20, base + bonus));
}

    great: ['와, 오늘 대성공이야!! 🎉🎉🎉','내가 이렇게 잘할 줄 몰랐어! ✨','완전 대박났다!! 기분 최고~!!!','오늘은 모든 게 잘 풀렸어! 😄','역대급 퍼포먼스!! 나 천재인 것 같아~!'],
    edu: ['오늘 배운 내용이 머릿속에 쏙 들어왔어! 📚','공부는 힘들지만... 뭔가 성장하는 느낌이야.','선생님이 칭찬해줬어! 기분 좋다~ 😊','어렵지만 재밌기도 해. 조금씩 늘고 있어!','오늘 수업 진짜 유익했어. 더 열심히 해야지!'],
    rest: ['아~ 진짜 쉬고 싶었는데 딱 좋다~ 😌','오늘은 아무 생각 없이 쉬었어. 행복해!','푹 쉬었더니 기분이 훨씬 좋아졌어! ✨','역시 가끔은 쉬는 것도 필요해. 재충전 완료!','몸과 마음이 가벼워진 것 같아~ 🌸']

// ════════ 스케줄 결과 계산 ════════
function calcResult(sch) {
  var tab = sch.tabType;
  var statChanges = {};
  var moneyChange = 0;
  var stressChange = 0;
  var outcome = 'normal';
  var line = '';

  if (tab === 'work') {
    var rate = calcSuccessRate(sch);
    var roll = Math.random() * 100;
    if (roll > rate + 15) {
      outcome = 'fail';
      moneyChange = Math.floor(sch.reward * 0.5);
      line = getRandLine('fail');
    } else if (roll < rate - 15) {
      outcome = 'great';
      moneyChange = Math.floor(sch.reward * 1.5);
      line = getRandLine('great');
    } else {
      outcome = 'normal';
      moneyChange = sch.reward;
      line = getRandLine('normal');
    }
    stressChange = sch.stress || 8;
    var mult = outcome === 'great' ? 1.2 : outcome === 'fail' ? 0.6 : 1.0;
    if (G.ailment === 'burnout') mult *= 0.5;
    if (G.ailment === 'shy') mult *= 0.7;
    for (var k in (sch.effects || {})) {
      statChanges[k] = Math.round((sch.effects[k] || 0) * mult);
    }
    if (G.ailment === 'burnout') stressChange = Math.floor(stressChange * 1.3);
  } else if (tab === 'edu') {
    outcome = 'edu';
    moneyChange = -(sch.cost || 0);
    stressChange = sch.stress || 5;
    line = getRandLine('edu');
    var emult = G.ailment === 'burnout' ? 0.5 : G.ailment === 'shy' ? 0.7 : 1.0;
    for (var ek in (sch.effects || {})) {
      statChanges[ek] = Math.round((sch.effects[ek] || 0) * emult);
    }
  } else {
    outcome = 'rest';
    moneyChange = -(sch.cost || 0);
    stressChange = sch.stress || 0;
    line = getRandLine('rest');
    for (var rk in (sch.effects || {})) {
      statChanges[rk] = sch.effects[rk] || 0;
    }
  }

  return { outcome: outcome, line: line, statChanges: statChanges, moneyChange: moneyChange, stressChange: stressChange };
}

// ════════ 유틸 ════════
function applyEff(effects) {
  for (var k in effects) {
    if (G.stats[k] !== undefined) {
      G.stats[k] = Math.min(SMAX, Math.max(0, (G.stats[k] || 0) + (effects[k] || 0)));
    }
  }
}

function addLog(text, cls) {
  if (!G || !G.log) return;
  G.log.unshift({ text: text, cls: cls || '' });
  if (G.log.length > 25) G.log.pop();
  renderLog();
}

function showToast(msg) {
  var old = document.getElementById('_toast');
  if (old) old.remove();
  var t = document.createElement('div');
  t.id = '_toast';
  t.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:50px;font-size:13px;font-weight:700;z-index:9999;white-space:nowrap;animation:_ft 2.4s ease forwards;pointer-events:none;';
  t.textContent = msg;
  if (!document.getElementById('_fts')) {
    var s = document.createElement('style');
    s.id = '_fts';
    s.textContent = '@keyframes _ft{0%{opacity:0;transform:translateX(-50%) translateY(-8px);}15%{opacity:1;transform:translateX(-50%) translateY(0);}75%{opacity:1;}100%{opacity:0;}}';
    document.head.appendChild(s);
  }
  document.body.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.remove(); }, 2400);
}

// ════════ 스케줄 승인 ════════
function approveSchedule() {
  var filled = 0;
  for (var i = 0; i < 4; i++) { if (G.monthSchedule[i] !== null) filled++; }
  if (filled < 4) { showToast('4주 스케줄을 모두 선택해주세요!'); return; }
  DQ = [];
  DI = 0;
  buildQueue();
  if (DQ.length === 0) {
    finishMonth();
    return;
  }
  showDlg();
}

// ════════ 대화 큐 생성 ════════
function buildQueue() {
  for (var w = 0; w < 4; w++) {
    var sch = G.monthSchedule[w];
    if (!sch) continue;
    var res = calcResult(sch);
    DQ.push({ type:'result', week:w+1, sch:sch, res:res });

    if (sch.id === 'rest_vacation') {
      var vev = VEVENTS[Math.floor(Math.random() * VEVENTS.length)];
      DQ.push({ type:'vacation', week:w+1, ev:vev });
    }

    if (sch.id === 'rest_friend' && Math.random() < 0.15) {
      DQ.push({ type:'fight', week:w+1 });
    }

    if (w === 3) {
      var w4ev = W4EVENTS[Math.floor(Math.random() * W4EVENTS.length)];
      DQ.push({ type:'week4', week:4, ev:w4ev });
    }
  }
}

function resetDlgFooter() {

// ════════ 대화 엔트리 렌더링 ════════
function renderDlgEntry() {
  if (DI >= DQ.length) {
    closeDlg();
    finishMonth();
    return;
  }

  var entry = DQ[DI];

  var prog = document.getElementById('dprog');
  if (prog) {
    prog.innerHTML = '';
    for (var i = 0; i < DQ.length; i++) {
      var dot = document.createElement('div');
      dot.className = 'dpdot' + (i < DI ? ' dn' : i === DI ? ' cu' : '');
      prog.appendChild(dot);
    }
  }

  var dhlb = document.getElementById('dhlb');
  if (dface) dface.textContent = getAvatar(G);
  if (dhlb) dhlb.textContent = MN[G.month - 1] + ' ' + entry.week + '주차';

    renderResultEntry(entry);
  } else if (entry.type === 'vacation') {

  } else if (entry.type === 'fight') {

// ════════ 일반 결과 엔트리 ════════
function renderResultEntry(entry) {
  var sch = entry.sch;
  var res = entry.res;
  var outcomeLabel = res.outcome === 'great' ? '🎉 대성공!! ' :
                     res.outcome === 'fail'  ? '😢 실패... ' : '😊 완료! ';

  var dwtit = document.getElementById('dwtit');

  var tags = document.getElementById('dtags');
  if (tags) {
    tags.innerHTML = '';
    if (res.moneyChange > 0) {
      tags.innerHTML += '<span class="dtag mn">💰 +' + res.moneyChange.toLocaleString() + '원</span>';
    } else if (res.moneyChange < 0) {
      tags.innerHTML += '<span class="dtag dn2">💸 ' + res.moneyChange.toLocaleString() + '원</span>';
    }
    if (res.stressChange > 0) {
      tags.innerHTML += '<span class="dtag ss">😰 스트레스 +' + res.stressChange + '</span>';
    } else if (res.stressChange < 0) {
      tags.innerHTML += '<span class="dtag up">😌 스트레스 ' + res.stressChange + '</span>';
    }
    for (var k in res.statChanges) {
      var v = res.statChanges[k];

// ════════ 결과 실제 적용 ════════
function applyResult(res) {
  G.money = Math.max(0, G.money + res.moneyChange);
  G.stress = Math.min(100, Math.max(0, G.stress + res.stressChange));
  applyEff(res.statChanges);

  if (G.ailment === 'sick')      G.stats.hp       = Math.max(0, (G.stats.hp       || 0) - 4);
  if (G.ailment === 'princess') { G.stats.morality = Math.max(0, (G.stats.morality || 0) - 2);
                                   G.stats.charm    = Math.min(SMAX, (G.stats.charm   || 0) + 1); }
  if (G.ailment === 'confident'){ G.stats.diligence= Math.min(SMAX,(G.stats.diligence||0)+1);
                                   G.stats.morality = Math.max(0, (G.stats.morality || 0) - 1); }
  renderAll();
}

// ════════ 월 마무리 ════════
function finishMonth() {
  if (G.ailment && G.ailmentMonths > 0) {
    G.ailmentMonths--;
    if (G.ailmentMonths <= 0) {
      if (AILMENTS[G.ailment]) addLog('✅ 상태이상 [' + AILMENTS[G.ailment].name + '] 회복!', 'good');
      G.ailment = null;
    }
  }

  checkStressAilment();
  addLog('🗓 ' + MN[G.month - 1] + ' 완료! 다음 달로 넘어가요.', 'event');

  G.month++;
  G.monthSchedule = [null, null, null, null];
  G.selectingWeek = 0;
  G.pickerTab = 'work';

  if (G.month > 12) {
    setTimeout(function() { triggerEnding(); }, 400);
    return;
  }

  rebuildSchCard();
  renderAll();
  showToast('🌸 ' + MN[G.month - 1] + '이 시작됐어요!');
}

// ════════ 입원 달 스킵 ════════
function skipHospital() {
  addLog('🏥 ' + MN[G.month - 1] + '은 입원으로 쉬었어요.', 'bad');
  if (G.ailmentMonths > 0) {
    G.ailmentMonths--;
    if (G.ailmentMonths <= 0) {
      G.ailment = null;
      addLog('✅ 퇴원했어요! 이제 활동할 수 있어요.', 'good');
    }
  }
  G.month++;
  G.monthSchedule = [null, null, null, null];
  G.selectingWeek = 0;
  G.pickerTab = 'work';

  if (G.month > 12) {
    setTimeout(function() { triggerEnding(); }, 400);
    return;
  }

  rebuildSchCard();
  renderAll();
  showToast('🌸 ' + MN[G.month - 1] + '이 시작됐어요!');
}

// ════════ 스트레스 상태이상 체크 ════════
function checkStressAilment() {
  if (G.ailment) return;

  if (G.stress >= 90) {
    var roll = Math.random();
    if (roll < 0.35) {
      G.ailment = 'hospitalized';
      G.ailmentMonths = 1;
      G.stress = 55;
      addLog('🏥 스트레스 극심! 쓰러져 입원했어요...', 'bad');
      showToast('🏥 입원했어요! 다음 달은 쉬어야 해요.');
    } else if (roll < 0.6) {
      G.ailment = 'burnout';
      G.ailmentMonths = 1;
      G.stress = 60;
      addLog('🤯 번아웃 발생! 모든 효과가 감소해요.', 'bad');
    } else {
      G.ailment = 'sick';
      G.ailmentMonths = 1;
      G.stress = 65;
      addLog('😷 과로로 감기 몸살에 걸렸어요!', 'bad');
    }
    return;
  }

  if (G.stress >= 70 && Math.random() < 0.25) {
    var pool = ['princess', 'confident', 'shy'];
    var picked = pool[Math.floor(Math.random() * pool.length)];
    G.ailment = picked;
    G.ailmentMonths = 1;
    addLog('⚠️ 상태이상: ' + AILMENTS[picked].name, 'bad');
  }
}

// ════════ 엔딩 판정 ════════
function triggerEnding() {
  if (G.stress >= 95 && G.stats.hp <= 8) {
    unlockEnding(BAD_ENDING.id);
    showEndingScreen(BAD_ENDING);
    return;
  }

  // 히든 엔딩 먼저 체크
  for (var i = 0; i < ENDINGS.length; i++) {
    var e = ENDINGS[i];
    if (e.rare && e.rare.indexOf('히든') >= 0) {
      if (e.cond(G)) {
        unlockEnding(e.id);
        showEndingScreen(e);
        return;
      }
    }
  }

  // 일반 엔딩 조건 충족 목록 수집
  var matched = [];
  for (var j = 0; j < ENDINGS.length; j++) {
    var en = ENDINGS[j];
    if (en.id === 'e_normal') continue;
    if (en.rare && en.rare.indexOf('히든') >= 0) continue;
    if (en.cond(G)) matched.push(en);
  }

  if (matched.length > 0) {
    // 희귀도가 높은 엔딩 우선 (별 개수로 정렬)
    matched.sort(function(a, b) {
      var ra = (a.rare || '').length;
      var rb = (b.rare || '').length;
      return rb - ra;
    });
    // 상위 후보에서 랜덤 선택
    var topCount = Math.min(matched.length, 3);
    var picked = matched[Math.floor(Math.random() * topCount)];
    unlockEnding(picked.id);
    showEndingScreen(picked);
    return;
  }

  // 기본 엔딩
  var normal = null;
  for (var n = 0; n < ENDINGS.length; n++) {
    if (ENDINGS[n].id === 'e_normal') { normal = ENDINGS[n]; break; }
  }
  unlockEnding('e_normal');
  showEndingScreen(normal);
}

// ════════ 엔딩 화면 표시 ════════
function showEndingScreen(ending) {
  if (!ending) return;
  var eico = document.getElementById('eico');
  var etit = document.getElementById('etit');
  var esub = document.getElementById('esub');
  var edesc = document.getElementById('edesc');
  var efw = document.getElementById('efw');
  var estats = document.getElementById('estats');
  if (eico) eico.textContent = ending.icon;
  if (etit) etit.textContent = ending.name;
  if (esub) esub.textContent = ending.rare || '';
  if (edesc) edesc.textContent = ending.desc;
  if (efw) efw.textContent = (ending.rare && ending.rare.indexOf('히든') >= 0) ? '🌟💎🌟💎🌟' : '🎉🎊🎉🎊🎉';

  if (estats) {
    estats.innerHTML = '<p style="font-weight:700;margin-bottom:6px">📊 최종 스테이터스</p>';
    for (var i = 0; i < SD.length; i++) {
      var def = SD[i];
      estats.innerHTML += '<p>' + def.name + ': <b>' + (G.stats[def.key] || 0) + '</b></p>';
    }
    estats.innerHTML += '<p>💰 최종 잔액: <b>' + G.money.toLocaleString() + '원</b></p>';
    estats.innerHTML += '<p>😰 최종 스트레스: <b>' + G.stress + '</b></p>';
  }

  localStorage.removeItem('harang_save');
  goScreen('se');
}

// ════════ 이벤트 바인딩 (onclick 대신 addEventListener 사용 - 핵심 버그 수정) ════════
window.onload = function() {
  // 타이틀 버튼
